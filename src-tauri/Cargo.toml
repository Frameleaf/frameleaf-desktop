[package]
name = "frameleaf-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "frameleaf-desktop"

[lib]
name = "frameleaf_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ed25519-dalek = "2"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
time = { version = "0.3", features = ["parsing"] }

tauri-plugin-single-instance = "2"
serde_json_canonicalizer = "=0.3.2"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tauri-plugin-dialog = "=2.8.3"
cap-std = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemInformation"] }
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

# Large signed-pack verification must stay practical in unsigned development builds.
[profile.dev.package.frameleaf-desktop]
opt-level = 1
debug-assertions = true

[profile.dev.package.sha2]
opt-level = 3
