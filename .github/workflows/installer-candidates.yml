name: Installer candidates
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: 'Successful main factory-runtime run containing signed runtimes'
        required: true
        type: string
      platforms:
        description: 'Candidate targets; Windows installers use Azure Artifact Signing'
        type: choice
        default: linux
        options: [linux, windows]
permissions:
  contents: read
  actions: read
concurrency:
  group: installer-candidates
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/aj/fd8-windows-desktop-012-candidate' && inputs.platforms == 'windows' && inputs.runtime_run_id == '41406368520'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8bdf871a7537f38c176d9fd73bbba8239eefd6df
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Validate factory source before allocating build runners
        id: source
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          CANDIDATE_PLATFORMS: ${{ inputs.platforms }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID" > "$RUNNER_TEMP/runtime-run.json"
          revision=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { validateFactoryRun } from "./tools/release_inputs.mjs";
            console.log(validateFactoryRun(JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/runtime-run.json")), process.env.GITHUB_REPOSITORY));
          ')
          test "$(git rev-parse HEAD)" = "8bdf871a7537f38c176d9fd73bbba8239eefd6df"
          git merge-base --is-ancestor "$revision" "8bdf871a7537f38c176d9fd73bbba8239eefd6df"
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { releaseMatrix } from "./tools/release_inputs.mjs";
            if (!["linux", "windows"].includes(process.env.CANDIDATE_PLATFORMS)) throw new Error("candidate_platforms_invalid");
            appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(releaseMatrix(process.env.CANDIDATE_PLATFORMS)) + "\n");
          '
  build:
    needs: prepare
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8bdf871a7537f38c176d9fd73bbba8239eefd6df
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id }}
          name: factory-runtime-${{ matrix.target }}
          path: runtime-download
      - name: Extract runtime without archive path escapes
        shell: python
        run: |
          import tarfile
          with tarfile.open('runtime-download/runtime.tar') as archive:
              archive.extractall('release-runtime', filter='data')
      - name: Verify signed runtime before native compilation
        shell: bash
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { packageConfiguration } from "./tools/package_desktop.mjs";
            const config = await packageConfiguration("release-runtime");
            config.bundle.targets = { linux: ["deb", "appimage"], win32: ["nsis", "msi"] }[process.platform];
            writeFileSync("candidate-config.json", JSON.stringify(config));
          '
      - name: Make verified Linux resources readable after system installation
        if: runner.os == 'Linux'
        run: chmod -R u=rwX,go=rX,a-s,a-t release-runtime
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev squashfs-tools
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Use the pinned host Node for actual Windows interop tests
        if: runner.os == 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Initialize hosted Windows cloud-files inspection
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          sc.exe query CldFlt
          fltmc.exe filters
          fltmc.exe instances
          Start-Service CldFlt -ErrorAction Continue
          $volumes = @($env:SystemDrive, (Split-Path -Qualifier $env:RUNNER_TEMP)) | Sort-Object -Unique
          foreach ($volume in $volumes) { fltmc.exe attach CldFlt $volume }
          fltmc.exe instances
          # Diagnostics cannot grant storage admission; the real profile tests below still enforce it.
          $global:LASTEXITCODE = 0
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer candidates
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build --verbose --config "$GITHUB_WORKSPACE/candidate-config.json" -- --locked 2>&1 | tee "$RUNNER_TEMP/frameleaf-installer-build.log"
      - name: Retain bundler diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-installer-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/frameleaf-installer-build.log
            candidate-config.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify signed runtime inside both Linux installers
        if: runner.os == 'Linux'
        run: bash tools/verify_linux_installers.sh
      - name: Install each unsigned Windows package and verify its bundled runtime and Welcome screen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($installers.Count -ne 2 -or @($installers.Extension | Sort-Object -Unique).Count -ne 2) { throw 'Expected NSIS and MSI installers' }
          foreach ($package in $installers) {
            if ((Get-AuthenticodeSignature -LiteralPath $package.FullName).Status -ne 'NotSigned') { throw 'Expected unsigned installer' }
            $dest = Join-Path $env:RUNNER_TEMP ("FrameleafQA" + $package.Extension.Substring(1))
            if (Test-Path $dest) { throw 'Expected a clean destination' }
            if ($package.Extension -eq '.exe') {
              $process = Start-Process -FilePath $package.FullName -ArgumentList '/S', "/D=$dest" -Wait -PassThru
            } else {
              $process = Start-Process msiexec.exe -ArgumentList '/i', ('"' + $package.FullName + '"'), '/qn', '/norestart', "INSTALLDIR=$dest", "APPLICATIONFOLDER=$dest", '/l*v', "$env:RUNNER_TEMP/frameleaf-msi.log" -Wait -PassThru
            }
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            $exe = Join-Path $dest 'frameleaf-desktop.exe'
            if (!(Test-Path $exe)) { throw "Missing installed desktop in $dest" }
            if ((Get-AuthenticodeSignature -LiteralPath $exe).Status -ne 'NotSigned') { throw 'Expected unsigned desktop executable' }
            @'
          from pathlib import Path
          import sys
          actual = Path(sys.argv[1]).read_bytes()
          built = Path('src-tauri/target/release/frameleaf-desktop.exe').read_bytes()
          marker = b'__TAURI_BUNDLE_TYPE_VAR_'
          installed_marker = marker + (b'MSI' if sys.argv[2] == '.msi' else b'NSS')
          if actual != built:
              for offset in range(len(actual)):
                  if offset >= len(built) or actual[offset] != built[offset]:
                      break
              start = actual.rfind(marker, max(0, offset - len(marker) - 2), offset + 1)
              if start < 0 or actual[start:start+len(installed_marker)] != installed_marker:
                  raise SystemExit('Unexpected difference outside installer marker')
              end = start + len(installed_marker)
              if built[start:end] not in [marker + t for t in (b'MSI', b'NSS', b'UNK')] or actual[:start] != built[:start] or actual[end:] != built[end:]:
                  raise SystemExit('Installed executable differs beyond Tauri bundle type')
          '@ | python - "$exe" "$($package.Extension)"
            if ($LASTEXITCODE) { throw 'Installed executable check failed' }
            $env:QA_RUNTIME = Join-Path $dest 'native-runtime'
            node --input-type=module -e "import {packageConfiguration} from './tools/package_desktop.mjs'; await packageConfiguration(process.env.QA_RUNTIME)"
            if ($LASTEXITCODE) { throw 'Installed runtime validation failed' }
            powershell.exe -NoProfile -File tools/qualify_windows_welcome.ps1 -Executable $exe
            if ($LASTEXITCODE) { throw 'Installed Welcome failed' }
            if ($package.Extension -eq '.msi') {
              $remove = Start-Process msiexec.exe -ArgumentList '/x', ('"' + $package.FullName + '"'), '/qn', '/norestart' -Wait -PassThru
            } else {
              $uninstaller = Get-Item (Join-Path $dest 'uninstall.exe')
              $remove = Start-Process $uninstaller.FullName -ArgumentList '/S', "_?=$dest" -Wait -PassThru
            }
            if ($remove.ExitCode -ne 0) { throw 'Uninstall failed' }
            Write-Output "Verified unsigned $($package.Extension) installation and signed runtime"
          }
      - name: Collect installers and provenance preserving executable modes
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          CANDIDATE_TARGET: ${{ matrix.target }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import tarfile
          import sys
          extensions = {'linux': {'.deb', '.AppImage'}, 'win32': {'.exe', '.msi'}}[sys.platform]
          files = [p for p in Path('src-tauri/target/release/bundle').rglob('*') if p.is_file() and p.suffix in extensions]
          if len(files) != 2 or {p.suffix for p in files} != extensions:
              raise SystemExit('Missing or ambiguous installer candidates')
          output = Path('candidate-installers')
          output.mkdir()
          hashes = {}
          for source in files:
              destination = output / source.name
              shutil.copy2(source, destination)
              if source.suffix == '.AppImage' and not os.access(destination, os.X_OK):
                  raise SystemExit('AppImage executable permission is missing')
              with destination.open('rb') as binary:
                  hashes[source.name] = hashlib.file_digest(binary, 'sha256').hexdigest()
          (output / 'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name, digest in sorted(hashes.items())))
          (output / 'candidate.json').write_text(json.dumps({
              'sourceRevision': '8bdf871a7537f38c176d9fd73bbba8239eefd6df', 'target': os.environ['CANDIDATE_TARGET'],
              'runtimeRunId': os.environ['RUNTIME_RUN_ID'], 'installedQualified': True, 'osSigned': False,
              'scope': 'GUI and existing-server helper candidate; full native host qualification remains separate',
              'files': hashes,
          }, indent=2) + '\n')
          with tarfile.open('installer-candidates.tar.gz', 'w:gz') as archive:
              archive.add(output, arcname='installers')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-installer-candidates-${{ matrix.target }}
          path: installer-candidates.tar.gz
          if-no-files-found: error
          retention-days: 7
