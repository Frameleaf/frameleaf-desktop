name: Signed desktop release
run-name: Signed desktop release ${{ inputs.tag || 'artifacts only' }} (${{ inputs.platforms }})
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing main-branch version tag for draft staging; leave empty for installer artifacts only'
        required: false
        type: string
      runtime_run_id:
        description: 'Successful main-branch run containing factory-runtime-<target> artifacts (each contains runtime.tar)'
        required: true
        type: string
      platforms:
        description: 'Release targets; each platform can be released alone and joins the same draft (Windows uses Azure Artifact Signing)'
        type: choice
        default: macos-linux
        options: [macos-linux, all, macos, linux, windows, macos-aarch64, macos-x86_64, linux-x86_64, linux-aarch64]
      companion_run_ids:
        description: 'With a tag: comma-separated run ids of macos-host-package.yml, ubuntu-host-qualification.yml and windows-compiled-host.yml for the selected platforms, or none'
        required: false
        type: string
      allow_unreleased_catalogue:
        description: 'Release although the model catalogue is newer than the latest server release (normally: release the server first)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: signed-desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      matrix: ${{ steps.source.outputs.matrix }}
      companions: ${{ steps.companions.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Validate immutable release source and runtime run
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          revision="$GITHUB_SHA"
          if [[ -n "$RELEASE_TAG" ]]; then
            node tools/release_inputs.mjs "$RELEASE_TAG" ||
              fail "Tag $RELEASE_TAG is not the version recorded in package.json, package-lock.json, src-tauri/Cargo.toml, src-tauri/Cargo.lock and src-tauri/tauri.conf.json on this commit."
            tagged=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}") || fail "Tag $RELEASE_TAG does not exist. Create it on $revision and push it first."
            [[ "$tagged" == "$revision" ]] ||
              fail "Tag $RELEASE_TAG points at $tagged, not at the commit this workflow runs on ($revision). A pushed tag is never moved: bump the version and tag the new commit."
          fi
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { releaseMatrix } from "./tools/release_inputs.mjs";
            appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(releaseMatrix(process.env.RELEASE_PLATFORMS)) + "\n");
          '
          [[ "$RUNTIME_RUN_ID" =~ ^[1-9][0-9]*$ ]] || fail "runtime_run_id must be the numeric id of a factory-runtime.yml run."
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID" > "$RUNNER_TEMP/runtime-run.json"
          factory_revision=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { validateFactoryRun } from "./tools/release_inputs.mjs";
            console.log(validateFactoryRun(JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/runtime-run.json")), process.env.GITHUB_REPOSITORY));
          ') || fail "Run $RUNTIME_RUN_ID is not a successful manual factory-runtime.yml run on main in this repository."
          git merge-base --is-ancestor "$factory_revision" "$revision" ||
            fail "Factory run $RUNTIME_RUN_ID was built from $factory_revision, which is not in the history of $revision."
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | {name, expired}' > "$RUNNER_TEMP/runtime-artifacts.jsonl"
          node tools/release_prerequisites.mjs factory-artifacts "$RUNNER_TEMP/runtime-artifacts.jsonl" "$RELEASE_PLATFORMS" "$RUNTIME_RUN_ID"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Check every selected pack's source, profile and epoch before anything is built
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          RELEASE_MATRIX: ${{ steps.source.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '### Factory runtime packs' >> "$GITHUB_STEP_SUMMARY"
          for target in $(jq -r '.include[].target' <<< "$RELEASE_MATRIX"); do
            pack="$RUNNER_TEMP/pack-$target"
            gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "factory-runtime-$target" --dir "$pack"
            # Read the two manifests only; the payload is verified against its signature by the build job.
            python3 -I - "$pack/runtime.tar" "$pack/manifests" <<'PY'
          import sys, tarfile
          from pathlib import Path
          archive, output = sys.argv[1:]
          Path(output).mkdir()
          with tarfile.open(archive) as tar:
              for member in tar:
                  if member.name == 'payload' or member.name.startswith('payload/'):
                      break
                  if member.name in ('manifest.json', 'manifest-accelerated.json'):
                      if not member.isfile() or member.size > 8 * 1024 * 1024:
                          raise SystemExit('::error::The factory pack has an invalid manifest')
                      Path(output, member.name).write_bytes(tar.extractfile(member).read())
          PY
            node tools/release_prerequisites.mjs factory-pack "$target" "$pack/manifests" "${RELEASE_TAG:+release}" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -rf "$pack"
          done
      - name: Check the model catalogue against the latest server release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ALLOW_UNRELEASED_CATALOGUE: ${{ inputs.allow_unreleased_catalogue }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'Installer artifacts only: nothing is published, so the server release is not checked.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api 'repos/Frameleaf/frameleaf-app/releases?per_page=100' --jq '.[] | {tag_name, draft, prerelease}' > "$RUNNER_TEMP/server-releases.jsonl"
          server_tag=$(node tools/release_prerequisites.mjs server-release "$RUNNER_TEMP/server-releases.jsonl")
          gh api "repos/Frameleaf/frameleaf-app/contents/server/resources/desktop/model-catalogue.json?ref=$server_tag" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/server-catalogue.json"
          { echo '### Model catalogue'; node tools/release_prerequisites.mjs catalogue "$server_tag" "$RUNNER_TEMP/server-catalogue.json" "$ALLOW_UNRELEASED_CATALOGUE"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate the companion package runs
        id: companions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          COMPANION_RUN_IDS: ${{ inputs.companion_run_ids }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'plan={"attach":[],"manual":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs="$RUNNER_TEMP/companion-runs"
          mkdir "$runs"
          ids=$(node tools/release_prerequisites.mjs companion-ids "$COMPANION_RUN_IDS")
          for id in $ids; do gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$runs/$id.json"; done
          plan=$(node tools/release_prerequisites.mjs companions "$RELEASE_PLATFORMS" "$COMPANION_RUN_IDS" "$runs")
          while read -r run revision artifact workflow; do
            git merge-base --is-ancestor "$revision" "$GITHUB_SHA" ||
              { echo "::error::Companion run $run was built from $revision, which is not in the history of $GITHUB_SHA."; exit 1; }
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
            grep -qxF "$artifact" <<< "$names" ||
              { echo "::error::Companion run $run has no $artifact artifact (it expired, was deleted, or the run did not retain a release package). Run that workflow again and pass the new run."; exit 1; }
            # The signed manifest inside the package, checked as the Desktop built here checks it once installed.
            identity=-
            if grep -qxF "$artifact-identity" <<< "$names"; then
              identity="$RUNNER_TEMP/companion-identity-$run"
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact-identity" --dir "$identity" < /dev/null
            fi
            files=$(node tools/release_prerequisites.mjs companion-identity "$workflow" "$run" "$identity")
            plan=$(jq -c --arg run "$run" --argjson files "$files" '(.attach[] | select(.run == $run)).files = $files' <<< "$plan")
          done < <(jq -r '.attach[] | "\(.run) \(.revision) \(.artifact) \(.workflow)"' <<< "$plan")
          printf '%s' "$plan" > "$RUNNER_TEMP/companions.json"
          node tools/release_prerequisites.mjs companion-summary "$RUNNER_TEMP/companions.json" >> "$GITHUB_STEP_SUMMARY"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
  signing-preflight:
    # Environment variables are only readable inside the environment, so this small job reads them
    # before any platform starts its build.
    needs: prepare
    if: needs.prepare.result == 'success' && contains(needs.prepare.outputs.matrix, '"windows-x86_64"')
    environment: desktop-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Require the Windows signing configuration before any platform builds
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: node tools/release_prerequisites.mjs windows-signing
  build:
    needs: [prepare, signing-preflight]
    # The preflight is skipped when Windows is not selected; a failed one stops every platform.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.signing-preflight.result == 'success' || needs.signing-preflight.result == 'skipped') }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # The oldest macOS the app itself runs on: `app` in packaging/macos/minimum-versions.json.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev squashfs-tools
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id }}
          name: factory-runtime-${{ matrix.target }}
          path: runtime-download
      - name: Extract factory runtime without allowing archive path escapes
        shell: python
        run: |
          import tarfile
          with tarfile.open('runtime-download/runtime.tar') as archive:
              archive.extractall('release-runtime', filter='data')
      - name: Verify factory runtime and configure installer
        shell: bash
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { packageConfiguration } from "./tools/package_desktop.mjs";
            const config = await packageConfiguration("release-runtime");
            config.bundle.targets = { darwin: ["app"], win32: ["nsis", "msi"], linux: ["deb", "appimage"] }[process.platform];
            if (process.platform === "darwin") config.bundle.macOS = { hardenedRuntime: true };
            writeFileSync("release-config.json", JSON.stringify(config));
          '
      - name: Make verified Linux resources readable after system installation
        if: runner.os == 'Linux'
        run: chmod -R u=rwX,go=rX,a-s,a-t release-runtime
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing Apple ID}" "${APPLE_PASSWORD:?Missing app-specific password}" "${APPLE_TEAM_ID:?Missing Apple team}"
          bash tools/import_apple_certificate.sh
      - name: Configure Azure Artifact Signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-signing
        with:
          config: release-config.json
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}
          subject: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
      - name: Build signed installers (macOS app bundle)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: npm run tauri -- build --config "$GITHUB_WORKSPACE/release-config.json" -- --locked
      - name: Check the app and its AI runtime need no newer macOS than each declares
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_macos_minimum.py --deployment-target "$MACOSX_DEPLOYMENT_TARGET" \
            --report "$RUNNER_TEMP/macos-minimum-versions.json" src-tauri/target/release/bundle/macos/Frameleaf.app
          { echo '### macOS minimum versions'; echo '```json'; cat "$RUNNER_TEMP/macos-minimum-versions.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the macOS GUI with its provisioned Keychain identity and package the DMG
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROVISION_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PROFILE_BASE64:?Missing macOS Developer ID profile}"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/desktop.provisionprofile"
          python tools/package_macos_dmg.py src-tauri/target/release/bundle "$RUNNER_TEMP/desktop.provisionprofile" "$RUNNER_TEMP/desktop-release.keychain-db"
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#images[@]} == 1 ]]
          mount=$(mktemp -d "$RUNNER_TEMP/verify-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/Frameleaf.app"
          node --input-type=module -e '
            import { packageConfiguration } from "./tools/package_desktop.mjs";
            await packageConfiguration(process.argv[1]);
          ' "$mount/Frameleaf.app/Contents/Resources/native-runtime"
          install=$(mktemp -d "$RUNNER_TEMP/installed-desktop.XXXXXX")
          ditto "$mount/Frameleaf.app" "$install/Frameleaf.app"
          codesign --verify --deep --strict "$install/Frameleaf.app"
          open -n -g -a "$install/Frameleaf.app"
          xcrun swift tools/qualify_macos_app_launch.swift "$install/Frameleaf.app"
      - name: Exercise the production Keychain entitlements on a disposable macOS user
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: bash tools/qualify_signed_macos_keychain.sh
      - name: Submit the distribution disk image to Apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#images[@]} == 1 ]]
          xcrun notarytool submit "${images[0]}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --no-wait --output-format json > src-tauri/target/release/bundle/dmg/dmg-submission.json
          jq -er '.id' src-tauri/target/release/bundle/dmg/dmg-submission.json
      - name: Retain the exact submitted image and request ID before waiting for Apple
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notarization-pending-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/dmg-submission.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify notarization and staple the submitted disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          id=$(jq -er '.id' src-tauri/target/release/bundle/dmg/dmg-submission.json)
          xcrun notarytool wait "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          jq '{id, status}' "$RUNNER_TEMP/dmg-notarization.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/dmg-notarization.json" > /dev/null
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun stapler staple "${images[0]}"
          xcrun stapler validate "${images[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${images[0]}"
      - name: Verify Windows executable and installer signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --input-type=module -e "import { packageConfiguration } from './tools/package_desktop.mjs'; await packageConfiguration('release-runtime');"
          if ($LASTEXITCODE) { throw 'Factory runtime changed during bundling' }
          $files = @(Get-Item src-tauri/target/release/frameleaf-desktop.exe)
          $installers = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($installers.Count -ne 2 -or @($installers.Extension | Sort-Object -Unique).Count -ne 2) { throw 'Expected NSIS and MSI installers' }
          foreach ($file in ($files + $installers)) {
            & ./tools/windows_sign.ps1 -Path $file.FullName -VerifyOnly
          }
      - name: Verify signed runtime inside both Linux installers
        if: runner.os == 'Linux'
        run: bash tools/verify_linux_installers.sh
      - name: Check no Linux binary needs a newer C library than Ubuntu 22.04 has
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          [[ ${#packages[@]} == 1 ]]
          python tools/check_linux_glibc.py --max 2.35 "${packages[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install and run the Linux package in clean Ubuntu and Debian containers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          [[ ${#packages[@]} == 1 ]]
          bash tools/qualify_linux_deb_install.sh "${packages[0]}"
      - name: Collect installers
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import sys
          extensions = {'darwin': {'.dmg'}, 'win32': {'.exe', '.msi'}, 'linux': {'.deb', '.AppImage'}}[sys.platform]
          files = [p for p in Path('src-tauri/target/release/bundle').rglob('*') if p.is_file() and p.suffix in extensions]
          if {p.suffix for p in files} != extensions or len({p.name for p in files}) != len(files):
              raise SystemExit('Missing or ambiguous release installers')
          Path('release-assets').mkdir()
          for path in files:
              shutil.copy2(path, Path('release-assets') / path.name)
      - name: Sign verified updater packages
        if: inputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing updater signing key}"
          version="${RELEASE_TAG#v}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bundle=src-tauri/target/release/bundle/macos
            xcrun stapler staple "$bundle/Frameleaf.app"
            xcrun stapler validate "$bundle/Frameleaf.app"
            arch="${RELEASE_TARGET#macos-}"
            [[ "$arch" != x86_64 ]] || arch=x64
            COPYFILE_DISABLE=1 tar -C "$bundle" -czf "release-assets/Frameleaf_${version}_${arch}.app.tar.gz" Frameleaf.app
          fi
          for file in release-assets/*; do
            case "$file" in
              *.app.tar.gz|*.AppImage|*.deb|*.msi|*.exe)
                npm run tauri -- signer sign --app-version "$version" "$file"
                ;;
            esac
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-installers-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          if [ -f "$RUNNER_TEMP/desktop-release.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/desktop-release.keychain-db"; fi
  stage:
    # `build` has a skipped ancestor when Windows is not selected, so its result is tested explicitly.
    if: ${{ !cancelled() && inputs.tag != '' && needs.build.result == 'success' }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: signed-installers-*
          merge-multiple: true
          path: release-assets
      - name: Install the updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Verify updater signatures and create this run's manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { updateManifest, verifyUpdaterAsset } from "./tools/release_inputs.mjs";
          const dir = "release-assets";
          const packages = readdirSync(dir).filter(name => /\.(app\.tar\.gz|AppImage|deb|exe|msi)$/.test(name));
          const signatures = Object.fromEntries(packages.map(name => [name, readFileSync(`${dir}/${name}.sig`, "utf8")]));
          const manifest = updateManifest(process.env.RELEASE_TAG, process.env.GITHUB_REPOSITORY, signatures);
          const { plugins: { updater } } = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          for (const name of packages) verifyUpdaterAsset(`${dir}/${name}`, signatures[name], updater.pubkey, manifest.version);
          writeFileSync(`${process.env.RUNNER_TEMP}/incoming-latest.json`, JSON.stringify(manifest));
          JS
      - name: Add the companion packages from their validated runs
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANIONS: ${{ needs.prepare.outputs.companions }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r run workflow artifact files; do
            download="$RUNNER_TEMP/companion-$run"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$download" < /dev/null
            # Exactly the files, by checksum, that `prepare` read from the run's identity record.
            names=$(node tools/release_prerequisites.mjs companion-artifact "$workflow" "$download" "$files")
            while read -r name; do mv "$download/$name" "release-assets/$name"; done <<< "$names"
            rm -rf "$download"
          done < <(jq -r '.attach[] | "\(.run) \(.workflow) \(.artifact) \(.files | tojson)"' <<< "$COMPANIONS")
      # FD-60: the CUDA and OpenVINO packs the app downloads on demand. Each is verified against
      # its signed delivery manifest (the one the installers carry) before its parts join this
      # run's assets; the draft merge below uploads them like any other asset.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id }}
          pattern: factory-accelerated-*
          path: accelerated-packs
      - name: Verify the downloadable GPU runtime parts and stage them as release files
        shell: bash
        run: |
          set -euo pipefail
          node tools/deliver_runtime.mjs --release accelerated-packs release-assets | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Merge this run into the draft for the tag
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          COMPANIONS: ${{ needs.prepare.outputs.companions }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | {id, tag_name, draft, body, assets: [.assets[] | {id, name, state, digest}]}' > "$RUNNER_TEMP/releases.jsonl"
          node tools/release_draft.mjs find "$RELEASE_TAG" "$RUNNER_TEMP/releases.jsonl" "$RUNNER_TEMP/draft.json" | tee "$RUNNER_TEMP/draft.env"
          cat "$RUNNER_TEMP/draft.env" >> "$GITHUB_OUTPUT"
          existing=-
          asset=$(sed -n 's/^manifest_asset=//p' "$RUNNER_TEMP/draft.env")
          if [[ -n "$asset" ]]; then
            existing="$RUNNER_TEMP/existing-latest.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset" -H 'Accept: application/octet-stream' > "$existing"
          fi
          printf '%s' "$COMPANIONS" > "$RUNNER_TEMP/companions.json"
          note="Signed installer candidate for $RELEASE_PLATFORMS from $RELEASE_REVISION. Installed-device acceptance and release approval are required before publication. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID $(node tools/release_prerequisites.mjs companion-note "$RUNNER_TEMP/companions.json")"
          node tools/release_draft.mjs merge "$RELEASE_TAG" "$GITHUB_REPOSITORY" release-assets "$RUNNER_TEMP/incoming-latest.json" \
            "$RUNNER_TEMP/draft.json" "$existing" "$RUNNER_TEMP/draft" "$note"
          cat "$RUNNER_TEMP/draft/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Stamp the package manager files from the checksums of the whole draft
        if: ${{ !contains(inputs.tag, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/release_packaging.mjs "$RUNNER_TEMP/draft/SHA256SUMS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !contains(inputs.tag, '-') }}
        with:
          name: package-manager-files
          path: |
            packaging/aur/
            packaging/chocolatey/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Create the draft release, or add this run's assets to it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          draft="$RUNNER_TEMP/draft"
          cd release-assets
          mapfile -t files < "$draft/upload.txt"
          if [[ -z "$RELEASE_ID" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "Frameleaf $RELEASE_TAG candidate" \
              --notes-file "$draft/notes.md" \
              -- "${files[@]}" "$draft/latest.json" "$draft/SHA256SUMS"
          else
            # Without --clobber an asset that already exists is refused, never replaced.
            if (( ${#files[@]} )); then gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -- "${files[@]}"; fi
            # Only the two files rebuilt from the whole draft are replaced.
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber -- "$draft/latest.json" "$draft/SHA256SUMS"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$draft/notes.md"
          fi
