name: Private Windows RAW candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-host-raw
  cancel-in-progress: false
jobs:
  raw:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: 3e5d58be808a8b48cf69f32e59d2f54c6ddf25c4
          fetch-depth: 2
          path: server-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Check RAW source and PE staging guards
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p test_qualify_windows_pe.py -v
          if ($LASTEXITCODE) { throw 'PE preflight fixture tests failed' }
          python -m unittest discover -s tools -p test_relocate_windows.py -v
          if ($LASTEXITCODE) { throw 'PE staging tests failed' }
          python -m unittest discover -s tools -p test_build_host_raw.py -v
          if ($LASTEXITCODE) { throw 'RAW source staging tests failed' }
          python -m unittest discover -s tools -p test_bind_host_raw.py -v
          if ($LASTEXITCODE) { throw 'RAW binding tests failed' }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        with:
          msystem: UCRT64
          update: true
          cache: false
          path-type: strict
          install: >-
            git make autoconf automake-wrapper libtool intltool perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-drmingw
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-iso-codes
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-potrace
            mingw-w64-ucrt-x86_64-pugixml
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
      - name: Record authoring toolchain versions
        shell: msys2 {0}
        run: LC_ALL=C pacman -Q | LC_ALL=C sort > "$(cygpath -u "$RUNNER_TEMP")/fl-raw-toolchain.txt"
      - name: Reject toolchain drift before any probe or engine compilation
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          expected = (Path(os.environ['GITHUB_WORKSPACE']) / 'tools/windows-raw-toolchain.txt').read_text(encoding='utf-8').splitlines()
          actual = (root / 'fl-raw-toolchain.txt').read_text(encoding='utf-8').splitlines()
          if not expected or expected != sorted(expected) or actual != expected:
              raise SystemExit('Windows RAW toolchain differs from the reviewed package inventory')
          canonical = ('\n'.join(expected) + '\n').encode('utf-8')
          (root / 'fl-raw-toolchain-lock.json').write_text(json.dumps({
              'desktopSourceRevision': os.environ['GITHUB_SHA'],
              'packageInventorySha256': hashlib.sha256(canonical).hexdigest(),
              'packageCount': len(expected),
          }, indent=2) + '\n', encoding='utf-8')
      - name: Verify the C and C++ OpenMP authoring runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          probe="$(cygpath -u "$RUNNER_TEMP")/fl-raw-openmp"
          mkdir -p "$probe"
          cat > "$probe/probe.c" <<'C'
          #include <omp.h>
          #include <stdio.h>
          #if !defined(_OPENMP) || _OPENMP < 201511
          #error OpenMP 4.5 or newer is required
          #endif
          int main(void) {
            int threads = 0;
            #pragma omp parallel reduction(+:threads)
            threads += 1;
            printf("OpenMP=%d threads=%d\n", _OPENMP, threads);
            return threads < 1;
          }
          C
          for compiler in gcc g++; do
            "$compiler" -fopenmp "$probe/probe.c" -o "$probe/probe.exe"
            "$probe/probe.exe"
          done
      - name: Qualify this toolchain's actual PE inspector before engine compilation
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python tools/qualify_windows_pe.py --dependencies "$env:MSYS2_LOCATION/ucrt64" --work "$env:RUNNER_TEMP/fl-raw-pe-probe" | Tee-Object -FilePath "$env:RUNNER_TEMP/fl-raw-pe-qualification.json"
          if ($LASTEXITCODE) { throw 'RAW toolchain PE preflight failed' }
      - name: Build and relocate pinned patched native RAW engines
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python tools/build_host_raw.py --source "$env:GITHUB_WORKSPACE/server-source" --revision 3e5d58be808a8b48cf69f32e59d2f54c6ddf25c4 --dependency-prefix "$env:MSYS2_LOCATION/ucrt64" --output "$env:RUNNER_TEMP/fl-windows-raw"
          if ($LASTEXITCODE) { throw 'Native Windows RAW component qualification failed' }
      - name: Compile and verify the source-matched server consumer
        shell: pwsh
        run: |
          $package = Get-Content server-source/package.json -Raw | ConvertFrom-Json
          if ($package.packageManager -ne 'pnpm@12.11.2') { throw 'Source package manager mismatch' }
          npm install --global pnpm@12.11.2
          if ($LASTEXITCODE) { throw 'Pinned package manager installation failed' }
          $node = (Get-Command node).Source
          python tools/build_host_server.py --source "$env:GITHUB_WORKSPACE/server-source" --revision 3e5d58be808a8b48cf69f32e59d2f54c6ddf25c4 --node $node --output "$env:RUNNER_TEMP/fl-raw-server"
          if ($LASTEXITCODE) { throw 'RAW server consumer qualification failed' }
      - name: Bind and qualify actual production RAW consumers
        shell: pwsh
        run: |
          python tools/bind_host_raw.py --source "$env:GITHUB_WORKSPACE/server-source" --server "$env:RUNNER_TEMP/fl-raw-server" --raw "$env:RUNNER_TEMP/fl-windows-raw" --output "$env:RUNNER_TEMP/fl-raw-runtime"
          if ($LASTEXITCODE) { throw 'RAW consumer binding failed' }
          node tools/qualify_host_raw.mjs "$env:RUNNER_TEMP/fl-raw-runtime" "$env:RUNNER_TEMP/fl-windows-raw" | Tee-Object -FilePath "$env:RUNNER_TEMP/fl-raw-runtime/raw-qualification.json"
          if ($LASTEXITCODE) { throw 'Production RAW rendering qualification failed' }
      - name: Archive the qualified RAW component with consumer evidence
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile
          root = Path(os.environ['RUNNER_TEMP'])
          component = root / 'fl-windows-raw'
          consumer = root / 'fl-raw-runtime/raw-qualification.json'
          if json.loads(consumer.read_text(encoding='utf-8-sig')).get('qualification') != 'passed':
              raise SystemExit('Production RAW consumer qualification is missing')
          evidence = {
              'consumer-qualification.json': consumer,
              'consumer-binding.json': root / 'fl-raw-runtime/qualification.json',
              'server-qualification.json': root / 'fl-raw-server/qualification.json',
              'pe-qualification.json': root / 'fl-raw-pe-qualification.json',
              'toolchain.txt': root / 'fl-raw-toolchain.txt',
              'toolchain-lock.json': root / 'fl-raw-toolchain-lock.json',
          }
          for name, source in evidence.items():
              shutil.copy2(source, component / name)
          with tarfile.open(root / 'windows-raw-component.tar.gz', 'w:gz') as archive:
              archive.add(component / 'raw', arcname='raw-candidate/raw')
              for name in ['qualification.json', *evidence]:
                  archive.add(component / name, arcname='raw-candidate/' + name)
      - name: Retain qualified RAW component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-raw-component
          path: ${{ runner.temp }}/windows-raw-component.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Retain bounded RAW qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-raw-diagnostics
          path: |
            ${{ runner.temp }}/fl-windows-raw/qualification.json
            ${{ runner.temp }}/fl-windows-raw/build.log
            ${{ runner.temp }}/fl-windows-raw/command-error.log
            ${{ runner.temp }}/fl-windows-raw/work/libraw/config.log
            ${{ runner.temp }}/fl-windows-raw/work/lensfun-build/CMakeCache.txt
            ${{ runner.temp }}/fl-windows-raw/work/darktable-build/CMakeCache.txt
            ${{ runner.temp }}/fl-windows-raw/work/darktable-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/fl-raw-toolchain.txt
            ${{ runner.temp }}/fl-raw-toolchain-lock.json
            ${{ runner.temp }}/fl-raw-pe-qualification.json
            ${{ runner.temp }}/fl-raw-server/qualification.json
            ${{ runner.temp }}/fl-raw-server/build.log
            ${{ runner.temp }}/fl-raw-server/command-error.log
            ${{ runner.temp }}/fl-raw-runtime/qualification.json
            ${{ runner.temp }}/fl-raw-runtime/raw-qualification.json
          retention-days: 7
          if-no-files-found: ignore
