name: Private Windows database fixture replay
on:
  pull_request:
    paths:
      - '.github/workflows/windows-database-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-database-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Replay the exact retained component with private loader diagnostics
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, stat, subprocess, sys, zipfile
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          from build_runtime import build_environment
          from build_host_database_windows import qualify
          output = Path(os.environ['RUNNER_TEMP']) / 'fl-database-replay'
          output.mkdir()
          archive = output / 'input.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh', 'api', 'repos/Frameleaf/frameleaf-desktop/actions/artifacts/12116805879/zip'], stdout=stream, check=True)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == '5601dd2fe0e125cc4f4f9516423330ae00f12563e5d173d5a680e0297df786f2', 'artifact digest mismatch'
          with zipfile.ZipFile(archive) as bundle:
              inputs = [item for item in bundle.infolist() if item.filename.startswith('postgres/')]
              assert inputs and len(inputs) < 20000 and sum(item.file_size for item in inputs) < 1024**3
              for item in inputs:
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in item.filename
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  bundle.extract(item, output)
              receipt = json.loads(bundle.read('qualification.json'))
          lock = json.loads(Path('runtime/host-database.json').read_text())
          assert receipt['pins'] == lock and receipt['sourceRevision'] == '947568067639827de73e2de7260103df697c7f51'
          assert receipt['platform'] == 'windows-x86_64' and receipt['redistributable'] is False
          prefix = output / 'postgres'
          env = build_environment(output, os.environ)
          env['PATH'] = str(prefix / 'bin') + os.pathsep + env['PATH']
          env['FRAMELEAF_BUILD_ERROR_LOG'] = str(output / 'command-error.log')
          report = {'qualification': 'failed', 'inputArtifactId': 12116805879, 'inputSha256': digest,
                    'componentBuildHead': 'a99fcce5bbb8cc9a962aa473d8888ad78ea845e0',
                    'sourceRevision': receipt['sourceRevision'], 'redistributable': False,
                    'installedPlatformQualified': False, 'dlls': [], 'entrypoints': []}
          probe = 'import ctypes,sys; ctypes.WinDLL(sys.argv[1], winmode=0x1100)'
          try:
              dlls = sorted((prefix / 'bin').glob('*.dll'))
              assert 0 < len(dlls) < 512
              for binary in dlls:
                  result = subprocess.run([sys.executable, '-c', probe, str(binary)], env=env,
                                          cwd=output, capture_output=True, text=True, timeout=15)
                  report['dlls'].append({'name': binary.name, 'exitCode': result.returncode, 'error': result.stderr})
                  (output / 'loader-report.json').write_text(json.dumps(report, indent=2))
              for name in ['initdb', 'postgres', 'psql']:
                  result = subprocess.run([str(prefix / 'bin' / (name + '.exe')), '--version'], env=env,
                                          cwd=output, capture_output=True, text=True, timeout=15)
                  report['entrypoints'].append({'name': name, 'exitCode': result.returncode,
                                                'stdout': result.stdout, 'stderr': result.stderr})
              (output / 'loader-report.json').write_text(json.dumps(report, indent=2))
              report['fixture'] = qualify(prefix, output, lock, env)
              # Compare loader behavior without changing captured-path execution authority.
              import ctypes
              from ctypes import wintypes
              kernel = ctypes.WinDLL('kernel32', use_last_error=True)
              kernel.CreateFileW.argtypes = [wintypes.LPCWSTR, wintypes.DWORD, wintypes.DWORD, ctypes.c_void_p, wintypes.DWORD, wintypes.DWORD, wintypes.HANDLE]
              kernel.CreateFileW.restype = wintypes.HANDLE
              kernel.GetFinalPathNameByHandleW.argtypes = [wintypes.HANDLE, wintypes.LPWSTR, wintypes.DWORD, wintypes.DWORD]
              kernel.GetFinalPathNameByHandleW.restype = wintypes.DWORD
              kernel.CloseHandle.argtypes = [wintypes.HANDLE]
              kernel.CloseHandle.restype = wintypes.BOOL
              handle = kernel.CreateFileW(str(prefix.resolve()), 0x80, 7, None, 3, 0x02200000, None)
              assert handle != ctypes.c_void_p(-1).value
              try:
                  buffer = ctypes.create_unicode_buffer(32768)
                  size = kernel.GetFinalPathNameByHandleW(handle, buffer, len(buffer), 2)
                  assert 0 < size < len(buffer)
                  captured = buffer.value
                  assert captured.startswith('\\Device\\HarddiskVolume')
              finally:
                  assert kernel.CloseHandle(handle)
              agent = (Path.cwd() / 'runtime/host-agent.mjs').as_uri()
              script = f'''import {{spawnSync}} from 'node:child_process';
              import {{join}} from 'node:path';
              const {{hostEnvironment}}=await import({json.dumps(agent)});
              const c=JSON.parse(process.argv[1]);
              const rows=[];
              for(const name of ['initdb','postgres','psql']){{
                const r=spawnSync(join(c.runtime,'bin',name+'.exe'),['--version'],{{env:hostEnvironment(c),cwd:process.cwd(),encoding:'utf8',timeout:15000,maxBuffer:65536,windowsHide:true}});
                rows.push({{name,exitCode:r.status,signal:r.signal,spawnCode:r.error?.code??null,stdout:(r.stdout??'').slice(0,2048),stderr:(r.stderr??'').slice(0,2048)}});
              }}
              console.log(JSON.stringify(rows));'''
              entries = {'node':'node.exe','postgres':'bin/postgres.exe','ffmpeg':'unused/ffmpeg.exe',
                         'ffprobe':'unused/ffprobe.exe','rawRenderer':'unused/darktable-cli.exe',
                         'rawDecoder':'unused/dcraw_emu.exe','studioBrowser':'unused/chrome.exe'}
              report['pathSpellingProbes'] = []
              for spelling, runtime in [('ordinary',str(prefix.resolve())), ('captured-device','\\\\.\\GLOBALROOT'+captured), ('captured-extended','\\\\?\\GLOBALROOT'+captured)]:
                  configuration = {'runtime':runtime,'state':str(output / 'probe-state'),'entryPoints':entries}
                  result = subprocess.run(['node','--input-type=module','--eval',script,json.dumps(configuration)],
                                          cwd=output, capture_output=True, text=True, timeout=60)
                  assert result.returncode == 0 and len(result.stdout) < 16384
                  report['pathSpellingProbes'].append({'spelling':spelling,'entrypoints':json.loads(result.stdout)})
              report['qualification'] = 'passed'
          finally:
              (output / 'loader-report.json').write_text(json.dumps(report, indent=2))
      - name: Retain bounded private diagnostic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-database-replay
          path: |
            ${{ runner.temp }}/fl-database-replay/loader-report.json
            ${{ runner.temp }}/fl-database-replay/command-error.log
            ${{ runner.temp }}/fl-database-replay/postgres.log
            ${{ runner.temp }}/fl-database-replay/pg-ctl-start.log
          retention-days: 7
          if-no-files-found: warn
