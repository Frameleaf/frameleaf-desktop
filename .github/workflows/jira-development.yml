name: Jira Development

on:
  pull_request:
    branches: ['main']
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  issue-key:
    name: Jira Issue Key
    if: github.repository == 'Frameleaf/frameleaf-desktop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # No PR checkout, credentials for Jira, write permissions, or interpolation
      # of user-controlled titles into executable code are needed.
      - name: Require a Frameleaf issue in the PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const dependencyUpdate = pr.user.type === 'Bot'
              && pr.user.login === 'dependabot[bot]'
              && pr.head.ref.startsWith('dependabot/');
            if (dependencyUpdate) {
              core.notice('Automated Dependabot update; no manually assigned issue required.');
              return;
            }
            const keys = Array.from(pr.title.matchAll(/(?:^|[^A-Za-z0-9])((?:FL|FD)-[1-9]\d*)(?=$|[^A-Za-z0-9])/g), match => match[1]);
            // Use GitHub's rendered links so code spans and sentence punctuation follow GFM.
            const { data: html } = await github.rest.markdown.render({
              text: pr.body ?? '',
              mode: 'gfm',
              context: `${context.repo.owner}/${context.repo.repo}`,
            });
            const destinations = Array.from(html.matchAll(/<a\b[^>]* href="([^"]*)"/g), match => match[1]);
            if (keys.length === 0) {
              core.setFailed('Include the assigned Jira issue in the PR title, for example: FL-118 Configure Frameleaf delivery or FD-5 UI update.');
            } else if (!destinations.some(url => keys.some(key => url === `https://heroit.atlassian.net/browse/${key}`))) {
              core.setFailed('Link an assigned title issue using its complete canonical Jira URL in the PR body.');
            }
