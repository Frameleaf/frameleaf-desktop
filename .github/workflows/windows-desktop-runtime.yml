name: Private Windows desktop with signed CPU runtime
on:
  workflow_call:
    inputs:
      runtime_signature_hex:
        description: Detached signature of the qualified current Windows runtime manifest
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
          cache: npm
      - name: Record disposable runner cloud-filter state
        shell: python
        run: |
          import subprocess
          for command in [['sc.exe', 'query', 'cldflt'], ['fltmc.exe', 'filters']]:
              result = subprocess.run(command, check=False, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(command, 'exit=', result.returncode, flush=True)
              print(result.stdout, flush=True)
      - name: Attach cloud filter only to disposable test volumes
        shell: python
        run: |
          import ntpath, os, re, subprocess, tempfile
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          inspector = ntpath.join(os.environ['SystemRoot'], 'System32', 'fltmc.exe')
          volumes = set()
          for path in [os.environ['RUNNER_TEMP'], tempfile.gettempdir()]:
              volume, tail = ntpath.splitdrive(path)
              assert re.fullmatch(r'[A-Za-z]:', volume) and ntpath.isabs(path)
              volumes.add(volume.upper())
          def attached(volume):
              result = subprocess.run([inspector, 'instances', '-v', volume], check=True, capture_output=True, text=True)
              print(result.stdout, flush=True)
              return bool(re.search(r'^\s*CldFlt\s', result.stdout, re.I | re.M))
          for volume in sorted(volumes):
              if not attached(volume):
                  subprocess.run([inspector, 'attach', 'CldFlt', volume], check=True)
              assert attached(volume), 'Cloud filter did not attach to the disposable test volume'
      - name: Acquire and verify the exact signed Windows runtime
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SIGNATURE_HEX: ${{ inputs.runtime_signature_hex }}
        run: |
          from pathlib import Path
          import json, os, re, stat, subprocess, sys, zipfile
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          from build_runtime import inventory, relative, sha256
          signature = os.environ['RUNTIME_SIGNATURE_HEX']
          assert re.fullmatch(r'[a-f0-9]{128}', signature)
          source = '4588eeb3994e7bd2bcb813536f34dd684e74857d'
          profiles = json.loads(Path('runtime/profiles.json').read_text())['profiles']
          assert source in profiles['cpu-ort']['additionalSources']['windows-x86_64']
          output = Path(os.environ['RUNNER_TEMP']) / 'fl-windows-desktop'
          output.mkdir()
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/Frameleaf/frameleaf-desktop/' + path]))
          run = api('actions/runs/40444074862')
          head = '1bbe1463aa0b57e32f83db40e4c82ff2e9d4ca5c'
          assert run['head_sha'] == head and run['status'] == 'completed' and run['conclusion'] == 'success'
          artifact = api('actions/artifacts/12707622091')
          assert artifact['workflow_run']['id'] == 40444074862 and artifact['workflow_run']['head_sha'] == head
          assert artifact['name'] == 'cpu-runtime-candidate-Windows' and not artifact['expired']
          assert 0 < artifact['size_in_bytes'] < 4 * 1024**3
          archive = output / 'runtime.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh', 'api', 'repos/Frameleaf/frameleaf-desktop/actions/artifacts/12707622091/zip'], stdout=stream, check=True)
          assert sha256(archive) == '660961f0edd1dd60a3221fbe0b46c72b6b4b6f06d9ad3425e300763662bc82b5'
          candidate = output / 'runtime'
          candidate.mkdir()
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              assert 0 < len(entries) <= 100000 and sum(item.file_size for item in entries) < 12 * 1024**3
              names = set()
              for item in entries:
                  name = relative(item.filename.rstrip('/'))
                  assert name.lower() not in names and not item.flag_bits & 1
                  names.add(name.lower())
                  assert stat.S_IFMT(item.external_attr >> 16) in {0, stat.S_IFDIR if item.is_dir() else stat.S_IFREG}
                  assert item.file_size < 4 * 1024**3
              bundle.extractall(candidate)
          assert sha256(candidate / 'manifest.json') == '44c945e9053dcba02c04d32b1e3c4e5580f9410a3c07f28618ec1ed4f0468e6c'
          (candidate / 'manifest.sig').write_bytes(bytes.fromhex(signature))
          verifier = Path('tools/sign_runtime.mjs').resolve().as_uri()
          code = 'import(' + json.dumps(verifier) + ').then(async m=>console.log(JSON.stringify(await m.verifySignedCandidate(process.argv[1]))))'
          checked = json.loads(subprocess.check_output(['node', '--input-type=module', '--eval', code, str(candidate)], text=True))
          assert checked['keyId'] == 'desktop-release-2026-10'
          manifest = checked['manifest']
          assert manifest['platform'] == 'windows' and manifest['architecture'] == 'x86_64'
          assert manifest['provider'] == 'CPUExecutionProvider' and manifest['sourceRevision'] == source
          assert inventory(candidate / 'payload') == manifest['files']
          (output / 'runtime-identity.json').write_text(json.dumps({'keyId': checked['keyId'], 'manifestSha256': checked['manifestSha256'], 'signatureSha256': sha256(candidate / 'manifest.sig')}, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('FRAMELEAF_SIGNED_RUNTIME=' + str(candidate) + '\n')
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Restore pinned Windows Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: src-tauri/target
          key: windows-2022-rust-1.95.0-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: python -m unittest discover -s tools -p test_qualify_windows_controller.py -v
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - id: rust-tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Qualify actual Windows credential persistence in the disposable runner
        timeout-minutes: 5
        shell: python
        env:
          FRAMELEAF_TEST_DISPOSABLE_KEYSTORE: '1'
        run: |
          from pathlib import Path
          import os, subprocess
          assert os.environ['GITHUB_ACTIONS'] == 'true'
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          subprocess.run(['cargo', 'build', '--locked', '--manifest-path', 'src-tauri/Cargo.toml',
              '--bin', 'frameleaf-native-host'], check=True)
          env = dict(os.environ)
          env['FRAMELEAF_TEST_CONTROLLER'] = str(Path('src-tauri/target/debug/frameleaf-native-host.exe').resolve(strict=True))
          test = 'credentials::qualification::disposable_runner_epoch_persistence'
          command = ['cargo', 'test', '--locked', '--manifest-path', 'src-tauri/Cargo.toml', '--lib']
          tests = subprocess.check_output([*command, '--', '--list'], text=True)
          assert tests.splitlines().count(test + ': test') == 1
          subprocess.run([*command, test, '--', '--exact', '--ignored'], env=env, check=True)
      - name: Qualify Windows package directory and receipt authority in the disposable runner
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          $tests = cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list
          if ($LASTEXITCODE) { throw 'Windows package test discovery failed' }
          $fixtures = @($tests | Select-String '^host_install::windows::package::tests::disposable_runner_.*: test$')
          if ($fixtures.Count -ne 3) { throw 'Windows package qualification fixtures are missing' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib host_install::windows::package::tests::disposable_runner_ -- --ignored
          if ($LASTEXITCODE) { throw 'Windows package qualification failed' }
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Qualify an isolated synthetic Windows cloud provider
        timeout-minutes: 5
        shell: pwsh
        run: |
          $test = 'copy_source::windows_cloud_tests::disposable_cloud_provider_qualification'
          $tests = cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($tests -match "^${test}: test$")) { throw 'The real CfApi qualification test is missing' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib $test -- --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the internal Windows desktop installer
        shell: python
        run: |
          from pathlib import Path
          import json, os, subprocess
          output = Path(os.environ['RUNNER_TEMP']) / 'fl-windows-desktop'
          cli = Path('node_modules/@tauri-apps/cli/tauri.js').resolve()
          assert subprocess.check_output(['node', str(cli), '--version'], text=True).strip() == 'tauri-cli 2.12.3'
          module = Path('tools/package_desktop.mjs').resolve().as_uri()
          code = 'import {packageConfiguration} from ' + json.dumps(module) + ';const c=await packageConfiguration(process.argv[1]);c.productName="Frameleaf Internal";c.bundle.targets=["nsis"];console.log(JSON.stringify(c));'
          config = output / 'tauri-internal.json'
          config.write_bytes(subprocess.check_output(['node', '--input-type=module', '--eval', code, os.environ['FRAMELEAF_SIGNED_RUNTIME']]))
          subprocess.run(['node', str(cli), 'build', '--debug', '--config', str(config), '--', '--locked'], check=True, timeout=2700)
      - name: Qualify final Windows controller dependencies without ambient runtime paths
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $inspectors = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe')
          if ($LASTEXITCODE -or $inspectors.Count -lt 1) { throw 'Controller dependency inspector is missing' }
          $controller = (Resolve-Path 'src-tauri/target/debug/frameleaf-native-host.exe').Path
          python tools/qualify_windows_controller.py $controller $inspectors[0] | Tee-Object -FilePath "$env:RUNNER_TEMP/fl-windows-desktop/controller-qualification.json"
          if ($LASTEXITCODE) { throw 'Windows controller dependency qualification failed' }
      - name: Verify both Windows executables and the embedded normal-signed runtime
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, sys
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          from build_runtime import sha256
          from qualify_windows_controller import nsis_gui_sha256
          output = Path(os.environ['RUNNER_TEMP']) / 'fl-windows-desktop'
          target = Path('src-tauri/target/debug').resolve()
          binaries = {}
          for name in ['frameleaf-desktop.exe', 'frameleaf-native-host.exe']:
              path = target / name
              with path.open('rb') as stream:
                  header = stream.read(64)
                  offset = int.from_bytes(header[60:64], 'little')
                  assert header[:2] == b'MZ' and 64 <= offset <= 1024**2
                  stream.seek(offset)
                  assert stream.read(6) == b'PE\0\0\x64\x86'
              binaries[name] = sha256(path)
          controller = json.loads((output / 'controller-qualification.json').read_text())
          assert controller['controllerSha256'] == binaries['frameleaf-native-host.exe']
          assert controller['systemOnlyDependencies'] is True and controller['sanitizedEntrypointQualified'] is True
          installers = list((target / 'bundle/nsis').glob('*.exe'))
          assert len(installers) == 1
          installer = installers[0]
          sevenzip = shutil.which('7z')
          assert sevenzip, 'archive inspector missing'
          expanded = output / 'expanded-installer'
          subprocess.run([sevenzip, 'x', str(installer), '-o' + str(expanded), '-y'], check=True, timeout=300)
          extracted_executables = {sha256(path) for path in expanded.rglob('*.exe') if path.is_file()}
          packaged_binaries = dict(binaries)
          packaged_binaries['frameleaf-desktop.exe'] = nsis_gui_sha256((target / 'frameleaf-desktop.exe').read_bytes())
          assert set(packaged_binaries.values()).issubset(extracted_executables), 'installer executable closure differs'
          identity = json.loads((output / 'runtime-identity.json').read_text())
          matches = [path.parent for path in expanded.rglob('manifest.json') if sha256(path) == identity['manifestSha256'] and (path.parent / 'manifest.sig').is_file()]
          assert len(matches) == 1
          verifier = Path('tools/sign_runtime.mjs').resolve().as_uri()
          code = 'import(' + json.dumps(verifier) + ').then(async m=>console.log(JSON.stringify(await m.verifySignedCandidate(process.argv[1]))))'
          checked = json.loads(subprocess.check_output(['node', '--input-type=module', '--eval', code, str(matches[0])], text=True))
          assert checked['keyId'] == identity['keyId'] and checked['manifestSha256'] == identity['manifestSha256']
          assert sha256(matches[0] / 'manifest.sig') == identity['signatureSha256']
          receipt = {'state': 'Windows-desktop-installer-built-and-embedded-runtime-verified', 'platform': 'windows-x86_64',
              'installer': installer.name, 'installerSha256': sha256(installer), 'binaries': binaries, 'packagedBinaries': packaged_binaries, 'controller': controller,
              'runtime': identity, 'installedAcceptance': False, 'osCodeSigned': False, 'fullHostComponentsIncluded': False}
          (output / 'result.json').write_text(json.dumps(receipt, indent=2) + '\n')
      - name: Retain the private installer and verification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-current-desktop-internal
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/frameleaf-desktop.exe
            src-tauri/target/debug/frameleaf-native-host.exe
            ${{ runner.temp }}/fl-windows-desktop/result.json
            ${{ runner.temp }}/fl-windows-desktop/runtime-identity.json
            ${{ runner.temp }}/fl-windows-desktop/controller-qualification.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain pinned Rust dependencies even when a source check fails
        if: ${{ !cancelled() && (steps.rust-tests.outcome == 'success' || steps.rust-tests.outcome == 'failure') && steps.rust-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: src-tauri/target
          key: windows-2022-rust-1.95.0-${{ hashFiles('src-tauri/Cargo.lock') }}
