name: Windows process path diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-process-path-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile and compare Windows process paths
        shell: pwsh
        run: |
          rustc --edition 2021 tools/diagnostics/windows_process_paths.rs -o "$env:RUNNER_TEMP/process-paths.exe"
          if ($LASTEXITCODE) { throw 'Diagnostic compilation failed' }
          & "$env:RUNNER_TEMP/process-paths.exe"
          if ($LASTEXITCODE) { throw 'Diagnostic failed' }
