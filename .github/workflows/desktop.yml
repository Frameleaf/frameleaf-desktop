name: Desktop candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      directory_probe:
        description: Run only Windows directory and shared-cache qualification
        type: boolean
        default: false
      keystore_probe:
        description: Qualify real OS credential persistence on disposable hosted runners
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !inputs.directory_probe && !inputs.keystore_probe }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The oldest macOS the app runs on: bundle.macOS.minimumSystemVersion in src-tauri/tauri.conf.json.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev squashfs-tools
      - name: Linux ELF relocation tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/frameleaf-patchelf"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error --output "$tool_dir/patchelf.tar.gz" https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz
          echo "a6818fef80128fb354423234ecacdcca3e993913d774e5d8346bc63f70fed4cf  $tool_dir/patchelf.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/patchelf.tar.gz" -C "$tool_dir"
          echo "$tool_dir/bin" >> "$GITHUB_PATH"
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Reuse Rust dependencies from successful main checks
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Test Windows signing trust checks without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test_windows_sign.ps1
      - run: npm test
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Use the pinned host Node for actual Windows interop tests
        if: runner.os == 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Initialize hosted Windows cloud-files inspection
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          sc.exe query CldFlt
          fltmc.exe filters
          fltmc.exe instances
          Start-Service CldFlt -ErrorAction Continue
          $volumes = @($env:SystemDrive, (Split-Path -Qualifier $env:RUNNER_TEMP)) | Sort-Object -Unique
          foreach ($volume in $volumes) { fltmc.exe attach CldFlt $volume }
          fltmc.exe instances
          # Diagnostics cannot grant storage admission; the real profile tests below still enforce it.
          $global:LASTEXITCODE = 0
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Qualify Windows controller dependencies without ambient runtime paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $inspectors = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe')
          if ($LASTEXITCODE -or $inspectors.Count -lt 1) { throw 'Controller dependency inspector is missing' }
          $controller = (Resolve-Path 'src-tauri/target/debug/frameleaf-native-host.exe').Path
          python tools/qualify_windows_controller.py $controller $inspectors[0]
          if ($LASTEXITCODE) { throw 'Windows controller dependency qualification failed' }
      - name: Qualify Windows package directory and receipt authority in disposable runner
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          $tests = cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list
          if ($LASTEXITCODE) { throw 'Windows package test discovery failed' }
          $fixtures = @($tests | Select-String '^host_install::windows::package::tests::disposable_runner_.*: test$')
          if ($fixtures.Count -ne 2) { throw 'Windows package qualification fixtures are missing' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib host_install::windows::package::tests::disposable_runner_ -- --ignored
          if ($LASTEXITCODE) { throw 'Windows package qualification failed' }
      - name: Check Windows native installer rolls back corrupt and long-path fixtures
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          $env:HOST_CONTROLLER = (Resolve-Path 'src-tauri/target/debug/frameleaf-native-host.exe').Path
          $env:HOST_CONTROLLER_SHA256 = (Get-FileHash $env:HOST_CONTROLLER).Hash.ToLowerInvariant()
          $env:HOST_MANIFEST = 'f' * 64
          $env:HOST_OUTPUT = Join-Path $env:RUNNER_TEMP 'installer-refusal'
          $env:HOST_ARCHIVE = Join-Path $env:RUNNER_TEMP 'windows-host.7z'
          $base = Join-Path $env:ProgramFiles 'Frameleaf'
          if (Test-Path -LiteralPath $base) { throw 'Expected a fresh disposable machine' }
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          $installer = "$env:HOST_OUTPUT/FrameleafNativeServer_0.1.0_x64-setup-unsigned.exe"
          $runtime = "$base/Runtimes/$env:HOST_MANIFEST"
          $controller = "$base/Controllers/$env:HOST_MANIFEST/$env:HOST_CONTROLLER_SHA256"
          Set-Content $env:HOST_ARCHIVE 'corrupt archive'
          foreach ($fixture in @('corrupt', 'long-path')) {
            if ($fixture -eq 'long-path') {
              Remove-Item -LiteralPath $env:HOST_ARCHIVE
              $folder = 'payload/' + ('a' * 70) + '/' + ('b' * 70)
              $entry = "$folder/" + ('c' * 70) + '.txt'
              if (("$runtime/$entry").Length -le 260) { throw 'The fixture path is too short' }
              $input = Join-Path $env:RUNNER_TEMP 'installer-long-path'
              New-Item -ItemType Directory -Path "$input/$folder" -Force | Out-Null
              Set-Content "$input/$entry" 'fixture'
              Push-Location $input
              try {
                & "$env:ProgramFiles/7-Zip/7z.exe" a -t7z $env:HOST_ARCHIVE payload
                if ($LASTEXITCODE) { throw 'Long-path fixture creation failed' }
              } finally { Pop-Location }
            }
            & $compiler /Q tools/windows/native-host.iss
            if ($LASTEXITCODE) { throw 'Native installer compilation failed' }
            $log = Join-Path $env:HOST_OUTPUT "$fixture.log"
            $setup = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -Wait -PassThru
            if (!$setup.ExitCode -or !(Test-Path "$base/Runtimes") -or (Test-Path $runtime) -or (Test-Path $controller)) {
              Get-Content $log -Tail 35
              throw "$fixture payload did not fail with a clean rollback"
            }
            if ($fixture -eq 'long-path' -and (
                !(Select-String -Quiet -SimpleMatch 'Server archive extraction completed.' -Path $log) -or
                !(Select-String -Quiet -SimpleMatch 'frameleaf-native-host.exe failed (exit' -Path $log))) {
              Get-Content $log -Tail 35
              throw 'Long-path extraction did not reach signed payload verification'
            }
          }
          $global:LASTEXITCODE = 0
      - name: Qualify per-user Windows profile preparation in disposable runner
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        env:
          FRAMELEAF_TEST_DISPOSABLE_HOST_PROFILE: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib windows_host_profile::tests::disposable_runner_prepares_only_a_fresh_os_selected_profile -- --exact --ignored
      - name: Check Windows real restore test is compiled
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tests = cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list
          if ($LASTEXITCODE) { throw 'Restore test discovery failed' }
          $restore = @($tests | Select-String '^host_state::activation::restore_qualification::actual_postgres_restore_selection_finalization_and_writer_admission: test$')
          if ($restore.Count -ne 1) { throw 'Windows real restore test is missing' }
          $hostAuthority = @($tests | Select-String '^release_policy::tests::factory_signed_host_candidate_verifies_against_compiled_authority: test$')
          if ($hostAuthority.Count -ne 1) { throw 'Windows compiled complete-host authority test is missing' }
      - name: Prepare Linux controller for protected-package qualification
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          stat --format='Controller bytes before debug-symbol removal: %s' src-tauri/target/debug/frameleaf-native-host
          strip --strip-debug src-tauri/target/debug/frameleaf-native-host
          stat --format='Controller bytes after debug-symbol removal: %s' src-tauri/target/debug/frameleaf-native-host
      - name: Qualify privileged Linux package admission in disposable runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/unshare --mount --propagation private /bin/sh -eu -c '
            [ -d /opt ]
            [ ! -L /opt ]
            [ ! -e /opt/frameleaf ]
            [ ! -L /opt/frameleaf ]
            /usr/bin/mount -t tmpfs -o mode=0755,nodev,nosuid frameleaf-admission /opt
            /usr/bin/python3 tools/qualify_linux_package_admission.py src-tauri/target/debug/frameleaf-native-host
            exec /usr/bin/python3 tools/qualify_linux_deb_lifecycle.py src-tauri/target/debug/frameleaf-native-host
          '
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned shell smoke-test candidate
        run: npm run desktop:build:shell -- --debug
      - name: Check no bundled macOS binary needs a newer macOS than declared
        if: runner.os == 'macOS'
        run: python tools/check_macos_minimum.py --deployment-target "$MACOSX_DEPLOYMENT_TARGET" src-tauri/target/debug/bundle/macos/Frameleaf.app
      - name: Install the unsigned Linux package in clean Ubuntu and Debian containers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(src-tauri/target/debug/bundle/deb/*.deb)
          [[ ${#packages[@]} == 1 ]]
          bash tools/qualify_linux_deb_install.sh "${packages[0]}"
      - name: Install the unsigned Windows shell and exercise Welcome
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'FrameleafWelcome'
          if (Test-Path $destination) { throw 'Expected a fresh install destination' }
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($install.ExitCode) { throw "NSIS failed: $($install.ExitCode)" }
          powershell.exe -NoProfile -File tools/qualify_windows_welcome.ps1 -Executable (Join-Path $destination 'frameleaf-desktop.exe')
          if ($LASTEXITCODE) { throw 'Installed Welcome check failed' }
      - name: Retain private candidate artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-desktop-shell-${{ runner.os }}
          path: src-tauri/target/debug/bundle/
          retention-days: 1
          if-no-files-found: error

  directory-probe:
    if: ${{ inputs.directory_probe && !inputs.keystore_probe }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Qualify host state, checkpoint and restore paths with spaces and Unicode
        run: node --test tools/test_host_agent.mjs tools/test_host_database.mjs tools/test_host_checkpoint.mjs tools/test_host_restore_input.mjs tools/test_host_server_owner.mjs
      - name: Inspect and initialize the hosted Windows cloud-files filter
        shell: pwsh
        run: |
          sc.exe query CldFlt
          fltmc.exe filters
          fltmc.exe instances
          Start-Service CldFlt -ErrorAction Continue
          $volumes = @($env:SystemDrive, (Split-Path -Qualifier $env:RUNNER_TEMP)) | Sort-Object -Unique
          foreach ($volume in $volumes) { fltmc.exe attach CldFlt $volume }
          fltmc.exe instances
          # Diagnostics cannot grant storage admission; the real profile tests below still enforce it.
          $global:LASTEXITCODE = 0
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - name: Qualify private directory admission and long physical paths
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib windows_protection::user::tests:: -- --nocapture
          if ($LASTEXITCODE) { throw 'Private Windows directory admission failed' }
      - name: Diagnose real shared model-cache composition
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib model_catalogue::tests::composes_distinct_revision_caches_without_replacing_weights_and_detects_tampering -- --exact --nocapture
          if ($LASTEXITCODE) { throw 'Private shared model-cache composition failed' }
      - name: Qualify Windows Manager descendant ownership
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib manager_host::windows_tests:: -- --nocapture
          if ($LASTEXITCODE) { throw 'Windows Manager descendant ownership failed' }
      - name: Qualify per-user host profile boundaries and controller pins
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib windows_host_profile::tests:: -- --nocapture
          if ($LASTEXITCODE) { throw 'Per-user Windows host profile qualification failed' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib host_state:: -- --nocapture
          if ($LASTEXITCODE) { throw 'Windows controller profile lifetime qualification failed' }
      - name: Qualify explicit per-user profile preparation on a disposable Windows runner
        if: ${{ !cancelled() && runner.environment == 'github-hosted' }}
        env:
          FRAMELEAF_TEST_DISPOSABLE_HOST_PROFILE: '1'
        shell: pwsh
        run: |
          $tests = cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list
          if ($LASTEXITCODE) { throw 'Per-user profile test discovery failed' }
          $fixture = @($tests | Select-String '^windows_host_profile::tests::disposable_runner_prepares_only_a_fresh_os_selected_profile: test$')
          if ($fixture.Count -ne 1) { throw 'Disposable per-user profile fixture is missing' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib windows_host_profile::tests::disposable_runner_prepares_only_a_fresh_os_selected_profile -- --exact --ignored --nocapture
          if ($LASTEXITCODE) { throw 'Disposable per-user profile preparation failed' }
      - name: Check Windows production and test code with strict Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  keystore-probe:
    if: ${{ inputs.keystore_probe }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      FRAMELEAF_TEST_DISPOSABLE_KEYSTORE: '1'
    steps:
      - name: Reject conflicting qualification probes
        if: ${{ inputs.directory_probe }}
        shell: bash
        run: |
          echo 'Select either directory_probe or keystore_probe, not both.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux native dependencies and Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev dbus-x11 gnome-keyring
      - name: Rust stable
        run: rustup update stable && rustup default stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify the real credential fixture is compiled
        shell: python
        run: |
          import subprocess
          tests = subprocess.check_output(["cargo", "test", "--locked", "--manifest-path", "src-tauri/Cargo.toml", "--lib", "--", "--list"], text=True)
          if tests.splitlines().count("credentials::qualification::disposable_runner_epoch_persistence: test") != 1:
              raise SystemExit("Real credential qualification fixture is missing")
      - name: Qualify actual macOS and Windows credential persistence
        if: runner.os != 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib credentials::qualification::disposable_runner_epoch_persistence -- --exact --ignored
      - name: Qualify actual Linux Secret Service persistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            python3 -c "import secrets, sys; sys.stdout.write(secrets.token_hex(32))" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib credentials::qualification::disposable_runner_epoch_persistence -- --exact --ignored
          '
