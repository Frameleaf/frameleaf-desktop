name: Copy release keys to Forgejo
# FL-1699, one-off: the release keys in GitHub's desktop-release environment cannot be read back, and
# installed apps only accept updates and runtime packs signed with them. This writes them, unprinted,
# into Forgejo's repository secrets and then turns on DESKTOP_RELEASE_ON_FORGEJO.
# Needs the repository secret FORGEJO_SECRETS_TOKEN (a Forgejo token with write:repository).
# ponytail: delete this workflow and that token once it has run.
on:
  workflow_dispatch:
permissions: {}
jobs:
  copy:
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    environment: desktop-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the release keys into Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_SECRETS_TOKEN }}
          DESKTOP_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.DESKTOP_RELEASE_ED25519_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FORGEJO_TOKEN:?Add the repository secret FORGEJO_SECRETS_TOKEN first}"
          repo=https://code.heroapps.ca/api/v1/repos/Frameleaf/frameleaf-desktop/actions
          umask 077
          auth="$RUNNER_TEMP/forgejo-auth"
          trap 'rm -f "$auth"' EXIT
          printf 'Authorization: token %s\n' "$FORGEJO_TOKEN" > "$auth"
          names=(DESKTOP_RELEASE_ED25519_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          # Check all of them before writing any, so Forgejo never holds half a set.
          missing=0
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || { echo "::error::$name is empty here"; missing=1; }
          done
          (( missing == 0 ))
          for name in "${names[@]}"; do
            jq -n --arg name "$name" '{data: env[$name]}' |
              curl --fail-with-body --silent --show-error -X PUT -H @"$auth" -H 'Content-Type: application/json' \
                --data-binary @- "$repo/secrets/$name" > /dev/null
            echo "Copied $name"
          done
          # Create the variable, or update it if it already exists.
          body='{"value":"true"}'
          curl --fail --silent -X POST -H @"$auth" -H 'Content-Type: application/json' -d "$body" \
              "$repo/variables/DESKTOP_RELEASE_ON_FORGEJO" > /dev/null ||
            curl --fail-with-body --silent --show-error -X PUT -H @"$auth" -H 'Content-Type: application/json' -d "$body" \
              "$repo/variables/DESKTOP_RELEASE_ON_FORGEJO" > /dev/null
          echo "DESKTOP_RELEASE_ON_FORGEJO is true on Forgejo"
