name: Windows compiled host authority qualification
on:
  workflow_dispatch:
    inputs:
      approvals:
        description: 'Reviewed immutable candidate and evidence approvals from the same successful signing run'
        required: true
        type: string
      desktop_sha256:
        description: 'Reviewed SHA-256 of the Windows Desktop candidate EXE'
        required: true
        type: string
      desktop_approval:
        description: 'Immutable installer-candidates producer approval plus sourceRevision and runtimeRunId (signed candidates)'
        required: true
        type: string
      watched_folder:
        description: 'Qualify hidden-window watched folder import with the signed Desktop at this main revision'
        type: boolean
        default: false
      media_move:
        description: 'Sign and run only the disposable installed media move qualification'
        type: boolean
        default: false
      media_move_manager_revision:
        description: 'Exact Manager source SHA in the reviewed signed host for media move qualification'
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-compiled-host-authority
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'Frameleaf/frameleaf-desktop' && github.ref == 'refs/heads/main'
    environment: ${{ inputs.media_move && 'desktop-release' || '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the private media move qualification selection
        if: inputs.media_move
        shell: pwsh
        env:
          WATCHED_FOLDER: ${{ inputs.watched_folder }}
          MEDIA_MOVE_MANAGER_REVISION: ${{ inputs.media_move_manager_revision }}
        run: |
          if ($env:WATCHED_FOLDER -eq 'true' -or $env:MEDIA_MOVE_MANAGER_REVISION -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Select media move alone and specify the exact Manager source SHA'
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - run: npm ci
      - run: npm run build
      - name: Rust stable
        shell: pwsh
        run: |
          rustup update stable
          if ($LASTEXITCODE) { throw 'Rust toolchain update failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust toolchain selection failed' }
      - name: Reuse successful main Rust dependencies without saving qualification payloads
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: false
      - name: Compile the real release-authority test without release credentials
        shell: pwsh
        run: |
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
          if ($LASTEXITCODE) { throw 'Compiled host qualification test build failed' }
      - name: Admit the matched signed candidate and evidence without executing payloads
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_APPROVALS: ${{ inputs.approvals }}
        run: |
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from obtain_signed_windows_host import obtain
          obtain(json.loads(os.environ['HOST_APPROVALS']), Path(os.environ['RUNNER_TEMP']) / 'windows-compiled-host')
      - name: Verify complete host and nested ML with compiled production authority
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $staged = Get-Content (Join-Path $root 'qualification.json') -Raw | ConvertFrom-Json
          $env:FRAMELEAF_FACTORY_HOST_TEST_PACK = Join-Path $root 'candidate'
          $env:FRAMELEAF_FACTORY_HOST_EXPECTED_MANIFEST = $staged.manifestSha256
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib release_policy::tests::factory_signed_host_candidate_verifies_against_compiled_authority -- --ignored --exact --nocapture
          if ($LASTEXITCODE) { throw 'Compiled host authority refused the signed candidate' }
          $result = Get-Content (Join-Path $root 'compiled-authority.json') -Raw | ConvertFrom-Json
          if ($result.qualification -ne 'passed' -or $result.manifestSha256 -ne $staged.manifestSha256 -or $result.signatureSha256 -ne $staged.signatureSha256) {
            throw 'Compiled host authority receipt does not match the admitted candidate'
          }
      - name: Obtain the reviewed corrected Windows Desktop candidate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_APPROVAL: ${{ inputs.desktop_approval }}
          DESKTOP_SHA256: ${{ inputs.desktop_sha256 }}
        run: |
          import sys
          sys.path.insert(0, 'tools')
          from windows_desktop_candidate import obtain
          obtain()
      - name: Configure signing for the private media move candidate
        if: inputs.media_move
        uses: ./.github/actions/windows-signing
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          profile: ${{ vars.AZURE_SIGNING_PROFILE }}
          subject: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
      - name: Require the exact signed media move inputs before building the fixture
        if: inputs.media_move
        shell: pwsh
        env:
          MEDIA_MOVE_MANAGER_REVISION: ${{ inputs.media_move_manager_revision }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $component = Get-Content (Join-Path $root 'candidate/payload/manager/component.json') -Raw | ConvertFrom-Json
          if ($component.sourceRevision -cne $env:MEDIA_MOVE_MANAGER_REVISION) {
            throw 'The signed host Manager does not match the reviewed source'
          }
          $producer = Get-Content (Join-Path $root 'desktop-producer.json') -Raw | ConvertFrom-Json
          if ($producer.candidate.osSigned -ne $true -or $producer.candidate.sourceRevision -cne $env:GITHUB_SHA) {
            throw 'Media move qualification requires a signed Desktop candidate at this main revision'
          }
          & ./tools/windows_sign.ps1 -Path (Join-Path $root 'desktop/setup.exe') -VerifyOnly
      - name: Build the native server installer from the verified host
        shell: pwsh
        env:
          MEDIA_MOVE: ${{ inputs.media_move }}
        run: |
          $controllerArgs = @('build', '--release', '--locked', '--manifest-path', 'src-tauri/Cargo.toml', '--bin', 'frameleaf-native-host')
          if ($env:MEDIA_MOVE -eq 'true') { $controllerArgs += @('--features', 'qualify-windows-media-move') }
          & cargo @controllerArgs
          if ($LASTEXITCODE) { throw 'Controller build failed' }
          $env:HOST_CONTROLLER = (Resolve-Path 'src-tauri/target/release/frameleaf-native-host.exe').Path
          if ($env:MEDIA_MOVE -eq 'true') { & ./tools/windows_sign.ps1 -Path $env:HOST_CONTROLLER }
          $env:HOST_CONTROLLER_SHA256 = (Get-FileHash $env:HOST_CONTROLLER).Hash.ToLowerInvariant()
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $env:HOST_MANIFEST = (Get-Content (Join-Path $root 'compiled-authority.json') -Raw | ConvertFrom-Json).manifestSha256
          if ($env:HOST_MANIFEST -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid manifest identity' }
          $env:HOST_ARCHIVE = Join-Path $root 'windows-host.7z'
          Push-Location (Join-Path $root 'candidate')
          try {
            & "${env:ProgramFiles}/7-Zip/7z.exe" a -t7z -mx=1 -mmt=2 $env:HOST_ARCHIVE manifest.json manifest.sig payload
            if ($LASTEXITCODE) { throw 'Verified payload archive creation failed' }
          } finally { Pop-Location }
          $env:HOST_OUTPUT = Join-Path $root 'installer'
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" /Q tools/windows/native-host.iss
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ($env:MEDIA_MOVE -eq 'true') {
            $setup = Join-Path $env:HOST_OUTPUT 'FrameleafNativeServer_0.1.0_x64-setup-unsigned.exe'
            & ./tools/windows_sign.ps1 -Path $setup
          }
      - name: Clear the private signing session before installing candidates
        if: inputs.media_move
        shell: pwsh
        run: |
          az account clear
          if ($LASTEXITCODE) { throw 'Could not clear the private signing session' }
      - name: Install the actual package twice and verify its protected receipt
        shell: pwsh
        env:
          MEDIA_MOVE: ${{ inputs.media_move }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $manifest = (Get-Content (Join-Path $root 'compiled-authority.json') -Raw | ConvertFrom-Json).manifestSha256
          $digest = (Get-FileHash 'src-tauri/target/release/frameleaf-native-host.exe').Hash.ToLowerInvariant()
          $setup = (Get-Item "$root/installer/FrameleafNativeServer_0.1.0_x64-setup-unsigned.exe").FullName
          if ($env:MEDIA_MOVE -eq 'true') { & ./tools/windows_sign.ps1 -Path $setup -VerifyOnly }
          $base = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Frameleaf'
          if (Test-Path -LiteralPath $base) { throw 'Expected a fresh machine location' }
          $receipt = Join-Path $base "Runtimes/$manifest/installation.json"
          foreach ($attempt in 1..2) {
            $log = Join-Path $root "setup-$attempt.log"
            $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" -PassThru -Wait
            if ($install.ExitCode) {
              Get-Content $log -Tail 35
              throw "Server installation failed with code $($install.ExitCode)"
            }
            $record = Get-Content $receipt -Raw | ConvertFrom-Json
            if ($record.schemaVersion -ne 1 -or $record.manifestSha256 -cne $manifest -or $record.controllerSha256 -cne $digest) { throw 'Installed receipt mismatch' }
            $hash = (Get-FileHash $receipt).Hash
            if ($attempt -eq 1) { $first = $hash } elseif ($first -ne $hash) { throw 'Retry changed the receipt' }
          }
          @{ state = 'resources-installed'; manifestSha256 = $manifest; controllerSha256 = $digest; installerSha256 = (Get-FileHash $setup).Hash.ToLowerInvariant()
             receiptSha256 = $hash.ToLowerInvariant(); installAttempts = 2 } | ConvertTo-Json | Set-Content (Join-Path $root 'protected-install.json')
      - name: Check the installed Manager program protection contract
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $receipt = Get-Content (Join-Path $root 'protected-install.json') -Raw | ConvertFrom-Json
          $base = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Frameleaf'
          $helper = Join-Path $base "Controllers/$($receipt.manifestSha256)/$($receipt.controllerSha256)/frameleaf-native-host.exe"
          foreach ($program in 'controller', 'restic') {
            $result = & $helper --verify-installed-program $receipt.manifestSha256 $receipt.controllerSha256 $program
            if ($LASTEXITCODE -or ($result | ConvertFrom-Json).state -cne 'protected') { throw 'Protected program check failed' }
          }
          & $helper --verify-installed-program $receipt.manifestSha256 $receipt.controllerSha256 invalid
          if ($LASTEXITCODE -ne 1) { throw 'Unknown program was not refused' }
          $global:LASTEXITCODE = 0
      - name: Retain private Windows installer candidate
        if: ${{ !inputs.media_move }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-native-server-installer
          path: ${{ runner.temp }}/windows-compiled-host/installer/*.exe
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Inspect and initialize the hosted Windows cloud-files filter
        shell: pwsh
        run: |
          sc.exe query CldFlt
          fltmc.exe filters
          fltmc.exe instances
          Start-Service CldFlt -ErrorAction Continue
          $volumes = @($env:SystemDrive, (Split-Path -Qualifier $env:RUNNER_TEMP)) | Sort-Object -Unique
          foreach ($volume in $volumes) { fltmc.exe attach CldFlt $volume }
          fltmc.exe instances
          # Diagnostics cannot grant storage admission; the real profile tests below still enforce it.
          $global:LASTEXITCODE = 0
      - name: Verify private profile admission on the disposable runner
        shell: pwsh
        env:
          FRAMELEAF_TEST_DISPOSABLE_HOST_PROFILE: '1'
        run: |
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib windows_host_profile::tests::disposable_runner_prepares_only_a_fresh_os_selected_profile -- --ignored --exact --nocapture
          if ($LASTEXITCODE) { throw 'Windows private profile admission failed' }
      - name: Install the reviewed Windows Desktop candidate
        id: desktop-install
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $setup = Join-Path $root 'desktop/setup.exe'
          if ('${{ inputs.watched_folder }}' -eq 'true') {
            $producer = Get-Content (Join-Path $root 'desktop-producer.json') -Raw | ConvertFrom-Json
            if ($producer.candidate.osSigned -ne $true -or $producer.candidate.sourceRevision -cne $env:GITHUB_SHA) {
              throw 'Watcher qualification requires the signed Desktop candidate built at this main revision'
            }
          }
          $destination = Join-Path $env:RUNNER_TEMP 'FrameleafWelcome'
          $install = Start-Process $setup -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($install.ExitCode) { throw 'Desktop installation failed' }
          "executable=$(Join-Path $destination 'frameleaf-desktop.exe')" >> $env:GITHUB_OUTPUT
      - name: Exercise the companion with the reviewed Windows Desktop candidate
        if: ${{ !inputs.watched_folder && !inputs.media_move }}
        id: installed-desktop
        shell: pwsh
        env:
          DESKTOP_EXE: ${{ steps.desktop-install.outputs.executable }}
        run: |
          powershell.exe -NoProfile -File tools/qualify_windows_welcome.ps1 -Executable $env:DESKTOP_EXE -InstalledHost
          if ($LASTEXITCODE) { throw 'Installed native host acceptance failed' }
      - name: Verify a watched folder while the installed Desktop window is hidden
        if: inputs.watched_folder
        shell: pwsh
        env:
          FRAMELEAF_WATCH_DESKTOP_EXE: ${{ steps.desktop-install.outputs.executable }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $hostReceipt = Get-Content (Join-Path $root 'protected-install.json') -Raw | ConvertFrom-Json
          $env:FRAMELEAF_INSTALLED_HOST_MANIFEST = $hostReceipt.manifestSha256
          if ((Get-AuthenticodeSignature -LiteralPath $env:FRAMELEAF_WATCH_DESKTOP_EXE).Status -ne 'Valid') {
            throw 'The installed Desktop executable signature is invalid'
          }
          $env:FRAMELEAF_WATCH_DESKTOP_SHA256 = (Get-FileHash -LiteralPath $env:FRAMELEAF_WATCH_DESKTOP_EXE).Hash.ToLowerInvariant()
          $test = 'host_setup::tests::disposable_runner_installed_desktop_watches_while_hidden'
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib $test -- --ignored --exact | Tee-Object -Variable output
          if ($LASTEXITCODE -or ($output -join '') -cnotmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw 'Installed watched folder acceptance did not pass' }
          @{ state = 'watcher-passed'; sourceRevision = $env:GITHUB_SHA; manifestSha256 = $env:FRAMELEAF_INSTALLED_HOST_MANIFEST
             executableSha256 = $env:FRAMELEAF_WATCH_DESKTOP_SHA256 } | ConvertTo-Json | Set-Content (Join-Path $root 'installed-watcher.json')
      - name: Qualify installed media cutover and rollback on separate disposable profiles
        if: inputs.media_move
        shell: pwsh
        env:
          MEDIA_MOVE_MANAGER_REVISION: ${{ inputs.media_move_manager_revision }}
          MEDIA_MOVE_DESKTOP: ${{ steps.desktop-install.outputs.executable }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $receipt = Get-Content (Join-Path $root 'protected-install.json') -Raw | ConvertFrom-Json
          $base = Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Frameleaf'
          $env:MEDIA_MOVE_CONTROLLER = Join-Path $base "Controllers/$($receipt.manifestSha256)/$($receipt.controllerSha256)/frameleaf-native-host.exe"
          $env:MEDIA_MOVE_CANDIDATE = Join-Path $base "Runtimes/$($receipt.manifestSha256)"
          $env:MEDIA_MOVE_MANIFEST = $receipt.manifestSha256
          $env:MEDIA_MOVE_CONTROLLER_SHA256 = $receipt.controllerSha256
          & ./tools/windows_sign.ps1 -Path $env:MEDIA_MOVE_CONTROLLER -VerifyOnly
          & ./tools/windows_sign.ps1 -Path $env:MEDIA_MOVE_DESKTOP -VerifyOnly
          @'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { basename, dirname, join } from 'node:path';
          import { qualifyWindowsMediaMove } from './tools/qualify_windows_media_move.mjs';
          const outcomes = [];
          for (const [offset, decision] of ['target', 'original'].entries()) {
            const installationId = randomBytes(6).toString('hex');
            outcomes.push(await qualifyWindowsMediaMove({
              controller: process.env.MEDIA_MOVE_CONTROLLER,
              host: { installationId, candidate: process.env.MEDIA_MOVE_CANDIDATE, manifestSha256: process.env.MEDIA_MOVE_MANIFEST },
              libraryId: installationId, release: 'frameleaf-v3.0.0-1', decision,
              managerPort: 33941 + offset * 3, databasePort: 33942 + offset * 3, apiPort: 33943 + offset * 3,
              confirmReview: async ({ targetPath, reviewSha256 }) => {
                assert.equal(basename(targetPath), 'target');
                assert.match(basename(dirname(targetPath)), /^Frameleaf Media Move Qualification [a-f0-9-]{36}$/);
                assert.match(reviewSha256, /^[a-f0-9]{64}$/);
                return reviewSha256;
              },
            }));
          }
          await writeFile(join(process.env.RUNNER_TEMP, 'windows-compiled-host', 'installed-media-move.json'),
            JSON.stringify({ state: 'media-move-passed', sourceRevision: process.env.GITHUB_SHA,
              managerRevision: process.env.MEDIA_MOVE_MANAGER_REVISION, manifestSha256: process.env.MEDIA_MOVE_MANIFEST,
              controllerSha256: process.env.MEDIA_MOVE_CONTROLLER_SHA256, outcomes: outcomes.map(({ decision }) => decision) }) + '\n');
          '@ | node --input-type=module
          if ($LASTEXITCODE) { throw 'Installed media move qualification failed' }
      - name: Report bounded installed host operation categories
        if: failure() && steps.installed-desktop.outcome == 'failure'
        run: node tools/diagnose_windows_host.mjs
      - name: Report the installed Manager startup error if Desktop setup fails
        if: failure() && steps.installed-desktop.outcome == 'failure'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-compiled-host'
          $env:FRAMELEAF_INSTALLED_HOST_MANIFEST = (Get-Content (Join-Path $root 'protected-install.json') -Raw | ConvertFrom-Json).manifestSha256
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib host_setup::tests::disposable_runner_diagnoses_installed_manager_start -- --ignored --exact --nocapture
          if ($LASTEXITCODE) { throw 'Installed Manager diagnostic failed' }
      - name: Retain bounded resource qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-compiled-host-authority
          path: |
            ${{ runner.temp }}/windows-compiled-host/qualification.json
            ${{ runner.temp }}/windows-compiled-host/protected-install.json
            ${{ runner.temp }}/windows-compiled-host/compiled-authority.json
            ${{ runner.temp }}/windows-compiled-host/candidate-producer.json
            ${{ runner.temp }}/windows-compiled-host/evidence-producer.json
            ${{ runner.temp }}/windows-compiled-host/desktop-producer.json
            ${{ runner.temp }}/windows-compiled-host/installed-watcher.json
            ${{ runner.temp }}/windows-compiled-host/installed-media-move.json
            ${{ runner.temp }}/windows-compiled-host/signature-evidence/
          retention-days: 7
          if-no-files-found: warn
