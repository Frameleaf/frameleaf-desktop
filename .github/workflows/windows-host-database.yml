name: Private Windows database candidate
on:
  pull_request:
    paths:
      - 'tools/build_host_database_windows.py'
      - 'tools/test_build_host_database_windows.py'
      - 'runtime/host-database.json'
      - '.github/workflows/windows-host-database.yml'
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Retained component artifact ID to replay instead of rebuilding (optional)'
        type: string
        default: ''
      artifact_sha256:
        description: 'Exact SHA-256 of the retained artifact ZIP (required for replay)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: windows-host-database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    if: github.event_name != 'workflow_dispatch' || (inputs.artifact_id == '' && inputs.artifact_sha256 == '')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_MAX_CONCURRENCY: '1'
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: 94d52a8244da0edfa9f680a3b357fdccbc0ad7e8
          path: server-source
          sparse-checkout: docker/postgres
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: bf19794383e8fb95eba5aa553235bc8ec2271688
          path: vcpkg
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check source and private DLL closure guards
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p test_build_host_database_windows.py -v
          if ($LASTEXITCODE) { throw 'Windows database packaging tests failed' }
      - name: Prepare MSVC and pinned build tools
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC installation unavailable' }
          $command = '"' + $vs + '\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE) { throw 'MSVC environment failed' }
          foreach ($line in $lines) {
            $parts = $line -split '=', 2
            if ($parts[0] -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsRedistDir')) {
              $line >> $env:GITHUB_ENV
            }
          }
          python -m pip install meson==1.12.1 ninja==1.13.2
          if ($LASTEXITCODE) { throw 'Pinned build tool installation failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'win_flex_bison-2.5.25.zip'
          Invoke-WebRequest 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw 'Parser tool digest mismatch' }
          $parserTools = Join-Path $env:RUNNER_TEMP 'winflexbison'
          Expand-Archive $zip $parserTools
          $parserTools >> $env:GITHUB_PATH
      - name: Build private dependencies from pinned vcpkg source
        shell: pwsh
        run: |
          & ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          $installed = Join-Path $env:RUNNER_TEMP 'frameleaf-db-dependencies'
          & ./vcpkg/vcpkg.exe install icu:x64-windows openssl:x64-windows lz4:x64-windows zstd:x64-windows zlib:x64-windows libxml2:x64-windows pkgconf:x64-windows "--x-install-root=$installed"
          if ($LASTEXITCODE) { throw 'Private dependency build failed' }
          $dependencies = Join-Path $installed 'x64-windows'
          $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC*.CRT') -Directory
          if ($crt.Count -ne 1) { throw 'Unique MSVC redistributable directory required' }
          Copy-Item (Join-Path $crt.FullName '*.dll') (Join-Path $dependencies 'bin')
          # This upstream Windows static library is pinned by bytes, not the mutable tag.
          $uuidZip = Join-Path $env:RUNNER_TEMP 'ossp-uuid.zip'
          Invoke-WebRequest 'https://github.com/dpage/winpgbuild/releases/download/ossp-uuid-latest/ossp-uuid-latest.zip' -OutFile $uuidZip
          if ((Get-FileHash $uuidZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ff73170bd286667620133d4fe6e3a27843124287e014ed89d9831907e8a0b46f') { throw 'UUID dependency digest mismatch' }
          $uuidRoot = Join-Path $env:RUNNER_TEMP 'uuid-input'
          Expand-Archive $uuidZip $uuidRoot
          Copy-Item "$uuidRoot/ossp-uuid/include/*" "$dependencies/include"
          Copy-Item "$uuidRoot/ossp-uuid/lib/*" "$dependencies/lib" -Recurse -Force
          $notice = Join-Path $dependencies 'share/ossp-uuid'
          New-Item -ItemType Directory -Path $notice | Out-Null
          Copy-Item "$uuidRoot/ossp-uuid/MANIFESTS/ossp-uuid.spdx.json" $notice
          $uuidSource = Join-Path $env:RUNNER_TEMP 'uuid-source.tar.gz'
          Invoke-WebRequest 'https://deb.debian.org/debian/pool/main/o/ossp-uuid/ossp-uuid_1.6.2.orig.tar.gz' -OutFile $uuidSource
          if ((Get-FileHash $uuidSource -Algorithm SHA256).Hash.ToLowerInvariant() -ne '11a615225baa5f8bb686824423f50e4427acd3f70d394765bdff32801f0fd5b0') { throw 'UUID source digest mismatch' }
          tar -xzf $uuidSource -C $env:RUNNER_TEMP uuid-1.6.2/README
          if ($LASTEXITCODE) { throw 'UUID source notice extraction failed' }
          Copy-Item "$env:RUNNER_TEMP/uuid-1.6.2/README" "$notice/copyright"
          (Join-Path $dependencies 'tools/pkgconf') >> $env:GITHUB_PATH
          "FRAMELEAF_DATABASE_DEPENDENCIES=$dependencies" >> $env:GITHUB_ENV
      - name: Build and qualify the native database
        shell: pwsh
        run: |
          python tools/build_host_database_windows.py --source "$env:GITHUB_WORKSPACE/server-source" --revision 94d52a8244da0edfa9f680a3b357fdccbc0ad7e8 --dependency-prefix "$env:FRAMELEAF_DATABASE_DEPENDENCIES" --output "$env:RUNNER_TEMP/frameleaf-windows-database"
          if ($LASTEXITCODE) { throw 'Native database qualification failed' }
      - name: Retain private component and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-private-database-candidate
          path: |
            ${{ runner.temp }}/frameleaf-windows-database/postgres/
            ${{ runner.temp }}/frameleaf-windows-database/qualification.json
            ${{ runner.temp }}/frameleaf-windows-database/build.log
            ${{ runner.temp }}/frameleaf-windows-database/command-error.log
            ${{ runner.temp }}/frameleaf-windows-database/postgres.log
            ${{ runner.temp }}/frameleaf-windows-database/work/configured/meson-logs/meson-log.txt
          retention-days: 7
          if-no-files-found: warn

  replay:
    if: github.event_name == 'workflow_dispatch' && (inputs.artifact_id != '' || inputs.artifact_sha256 != '')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download the exact retained component from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_ARTIFACT_ID: ${{ inputs.artifact_id }}
          COMPONENT_ARCHIVE_SHA256: ${{ inputs.artifact_sha256 }}
        shell: python
        run: |
          from pathlib import Path
          import json, os, re, subprocess
          identity = os.environ['COMPONENT_ARTIFACT_ID']
          assert re.fullmatch(r'[1-9][0-9]*', identity), 'invalid artifact identity'
          assert re.fullmatch(r'[a-f0-9]{64}', os.environ['COMPONENT_ARCHIVE_SHA256']), 'invalid artifact digest'
          endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/artifacts/' + identity
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert metadata['name'] == 'frameleaf-windows-private-database-candidate' and not metadata['expired'], 'unexpected artifact'
          with (Path(os.environ['RUNNER_TEMP']) / 'frameleaf-database-replay.zip').open('xb') as stream:
              subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=stream, check=True)
      - name: Replay isolated loader and database qualification with no build credentials
        id: replay
        env:
          COMPONENT_ARCHIVE_SHA256: ${{ inputs.artifact_sha256 }}
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p 'test_replay_host_database_windows.py'
          if ($LASTEXITCODE) { throw 'Replay guard tests failed' }
          # initdb re-executes with the Administrators SID disabled. Test a root explicitly owned by this user.
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $probe = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) ('frameleaf-db-replay-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $probe) { throw 'Probe directory already exists' }
          $directory = New-Item -ItemType Directory -Path $probe -ErrorAction Stop
          if ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Probe root is redirected' }
          $security = [System.Security.AccessControl.DirectorySecurity]::new()
          $security.SetOwner($sid)
          $security.SetAccessRuleProtection($true, $false)
          foreach ($identity in @($sid.Value, 'S-1-5-18', 'S-1-5-32-544')) {
            $rule = [System.Security.AccessControl.FileSystemAccessRule]::new([System.Security.Principal.SecurityIdentifier]::new($identity), 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $security.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $probe -AclObject $security -ErrorAction Stop
          $actual = Get-Acl -LiteralPath $probe
          if (!$actual.AreAccessRulesProtected -or $actual.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne $sid.Value) { throw 'Probe ownership is not private' }
          $rules = @($actual.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]))
          if ($rules.Count -ne 3 -or @($rules | Where-Object { $_.IsInherited -or $_.AccessControlType -ne 'Allow' -or $_.IdentityReference.Value -notin @($sid.Value, 'S-1-5-18', 'S-1-5-32-544') -or $_.FileSystemRights -ne 'FullControl' -or $_.InheritanceFlags -ne 'ContainerInherit,ObjectInherit' }).Count) { throw 'Probe ACL is not the explicit inheritable user policy' }
          "FRAMELEAF_DATABASE_REPLAY_PROBE=$probe" >> $env:GITHUB_ENV
          $actual.Sddl | Set-Content -LiteralPath (Join-Path $probe 'root-acl.txt')
          python tools/replay_host_database_windows.py --archive "$env:RUNNER_TEMP/frameleaf-database-replay.zip" --output "$probe/candidate" --sha256 "$env:COMPONENT_ARCHIVE_SHA256" --source-revision 94d52a8244da0edfa9f680a3b357fdccbc0ad7e8
          if ($LASTEXITCODE) { throw 'Retained database qualification failed; inspect loader receipt' }
      - name: Trace the failing restricted-token loader with the installed Microsoft debugger
        if: failure() && steps.replay.outcome == 'failure'
        shell: pwsh
        run: |
          $root = $env:FRAMELEAF_DATABASE_REPLAY_PROBE
          if (!$root -or !(Test-Path -LiteralPath "$root/candidate/loader-report.json")) { throw 'No admitted replay fixture' }
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (!(Test-Path -LiteralPath $cdb)) {
            'Installed Microsoft debugger unavailable' | Set-Content -LiteralPath "$root/debugger-status.txt"
            exit 0
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $cdb
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Debugger signature is not trusted Microsoft code' }
          $registry = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\initdb.exe'
          $existed = Test-Path -LiteralPath $registry
          $hadFlag = $false
          if ($existed) {
            $key = Get-Item -LiteralPath $registry
            $hadFlag = $key.GetValueNames() -contains 'GlobalFlag'
            if ($hadFlag) { $old = $key.GetValue('GlobalFlag'); $kind = $key.GetValueKind('GlobalFlag') }
          }
          try {
            New-Item -Path $registry -Force | Out-Null
            New-ItemProperty -LiteralPath $registry -Name GlobalFlag -PropertyType DWord -Value 2 -Force | Out-Null
            $binary = "$root/candidate/postgres/bin/initdb.exe"
            $log = "$root/loader-snaps.txt"
            $arguments = @('-o', '-g', '-G', '-logo', ('"' + $log + '"'), '-c', '"sxd 0xc0000135; g"', ('"' + $binary + '"'), '-D', ('"' + "$root/debug-data" + '"'), '--username=frameleaf', '--encoding=UTF8', '--locale=C', '--auth-local=reject', '--auth-host=reject')
            $debug = Start-Process -FilePath $cdb -ArgumentList $arguments -NoNewWindow -PassThru
            if (!$debug.WaitForExit(60000)) { $debug.Kill($true); $debug.WaitForExit(); 'timed-out' | Set-Content "$root/debugger-status.txt" }
            else { "exit=$($debug.ExitCode)" | Set-Content "$root/debugger-status.txt" }
          } finally {
            if ($hadFlag) { New-ItemProperty -LiteralPath $registry -Name GlobalFlag -PropertyType $kind -Value $old -Force | Out-Null }
            else { Remove-ItemProperty -LiteralPath $registry -Name GlobalFlag -ErrorAction SilentlyContinue }
            if (!$existed -and (Get-Item -LiteralPath $registry).Property.Count -eq 0) { Remove-Item -LiteralPath $registry }
          }
      - name: Retain bounded private replay diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-database-replay
          path: |
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/root-acl.txt
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/debugger-status.txt
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/loader-snaps.txt
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/candidate/loader-report.json
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/candidate/command-error.log
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/candidate/postgres.log
            ${{ env.FRAMELEAF_DATABASE_REPLAY_PROBE }}/candidate/pg-ctl-start.log
          retention-days: 7
          if-no-files-found: warn
