name: Private Windows server candidate
on:
  pull_request:
    paths:
      - 'tools/build_host_server.py'
      - 'tools/test_build_host_server.py'
      - 'tools/build_host_manager.py'
      - 'tools/test_build_host_manager.py'
      - 'tools/build_host_backup.py'
      - 'tools/test_build_host_backup.py'
      - 'runtime/host-backup*'
      - 'tools/build_host_exiftool_windows.py'
      - 'tools/test_build_host_exiftool_windows.py'
      - 'tools/qualify_host_exiftool.mjs'
      - 'tools/build_runtime.py'
      - '.github/workflows/windows-host-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-host-server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      RAYON_NUM_THREADS: '1'
      UV_THREADPOOL_SIZE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: aadd5f59ab68c4621885f852ee6953f23b55e556
          path: server-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Prepare source-matched package manager
        shell: pwsh
        run: |
          $package = Get-Content server-source/package.json -Raw | ConvertFrom-Json
          if ($package.packageManager -ne 'pnpm@12.11.2') { throw 'Source package manager mismatch' }
          npm install --global pnpm@12.11.2
          if ($LASTEXITCODE) { throw 'Pinned package manager installation failed' }
      - name: Check production package staging guards
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p test_build_host_server.py -v
          if ($LASTEXITCODE) { throw 'Server packaging tests failed' }
          python -m unittest discover -s tools -p test_build_host_exiftool_windows.py -v
          if ($LASTEXITCODE) { throw 'Private ExifTool binding tests failed' }
          python -m unittest discover -s tools -p test_build_host_manager.py -v
          if ($LASTEXITCODE) { throw 'Manager packaging tests failed' }
          python -m unittest discover -s tools -p test_build_host_backup.py -v
          if ($LASTEXITCODE) { throw 'Backup packaging tests failed' }
      - name: Compile and verify the actual private production server
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          python tools/build_host_server.py --source "$env:GITHUB_WORKSPACE/server-source" --revision aadd5f59ab68c4621885f852ee6953f23b55e556 --node $node --output "$env:RUNNER_TEMP/fl-windows-server"
          if ($LASTEXITCODE) { throw 'Windows production server qualification failed' }
      - name: Check native paths through the compiled Windows environment schema
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';
          assert.equal(process.platform, 'win32');
          const { EnvSchema } = await import(pathToFileURL(process.argv[2]).href);
          const keys = ['FRAMELEAF_MEDIA_LOCATION', 'FRAMELEAF_PLUGINS_INSTALL_FOLDER',
            'FRAMELEAF_STUDIO_WORKER_TRUST_DIR', 'FRAMELEAF_IMPORT_ROOTS'];
          for (const key of keys) {
            for (const value of [String.raw`C:\Frameleaf Data`, 'C:/Frameleaf/media',
              String.raw`\\server\share\media`,
              String.raw`\\.\GLOBALROOT\Device\HarddiskVolume5\Frameleaf\media`]) {
              assert.equal(EnvSchema.safeParse({ [key]: value }).success, true, `${key}: ${value}`);
            }
            for (const value of ['relative/media', './media', 'C:media', 'file:///media']) {
              assert.equal(EnvSchema.safeParse({ [key]: value }).success, false, `${key}: ${value}`);
            }
          }
          console.log('Compiled Windows environment schema: all four path fields passed');
          '@ | node --input-type=module - "$env:RUNNER_TEMP/fl-windows-server/server/dist/utils/environment-schema.js"
          if ($LASTEXITCODE) { throw 'Compiled Windows environment path checks failed' }
      - name: Bind and qualify private Windows metadata runtime
        shell: pwsh
        run: |
          python tools/build_host_exiftool_windows.py --server "$env:RUNNER_TEMP/fl-windows-server" --output "$env:RUNNER_TEMP/fl-windows-metadata"
          if ($LASTEXITCODE) { throw 'Private Windows ExifTool binding failed' }
          node tools/qualify_host_exiftool.mjs "$env:RUNNER_TEMP/fl-windows-metadata" | Tee-Object -FilePath "$env:RUNNER_TEMP/fl-windows-metadata/metadata-qualification.json"
          if ($LASTEXITCODE) { throw 'Production metadata qualification failed' }
      - name: Compile and bind the source-matched private Manager
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          python tools/build_host_manager.py --source "$env:GITHUB_WORKSPACE/server-source" --revision aadd5f59ab68c4621885f852ee6953f23b55e556 --node $node --output "$env:RUNNER_TEMP/fl-windows-manager"
          if ($LASTEXITCODE) { throw 'Windows production Manager qualification failed' }
      - name: Qualify the current private encrypted backup runtime
        shell: pwsh
        run: |
          python tools/build_host_backup.py --output "$env:RUNNER_TEMP/fl-windows-backup"
          if ($LASTEXITCODE) { throw 'Windows backup runtime qualification failed' }
      - name: Retain private server package and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frameleaf-windows-private-server-candidate
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/fl-windows-server/server/
            ${{ runner.temp }}/fl-windows-server/qualification.json
            ${{ runner.temp }}/fl-windows-server/build.log
            ${{ runner.temp }}/fl-windows-server/command-error.log
            ${{ runner.temp }}/fl-windows-metadata/
            ${{ runner.temp }}/fl-windows-manager/manager/
            ${{ runner.temp }}/fl-windows-manager/qualification.json
            ${{ runner.temp }}/fl-windows-manager/build.log
            ${{ runner.temp }}/fl-windows-manager/command-error.log
            ${{ runner.temp }}/fl-windows-backup/backup/
            ${{ runner.temp }}/fl-windows-backup/qualification.json
          retention-days: 7
          if-no-files-found: warn
