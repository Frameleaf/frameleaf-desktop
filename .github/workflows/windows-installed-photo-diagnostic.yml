name: Private Windows installed photo diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/windows-installed-photo-diagnostic.yml'
      - 'tools/diagnose_installed_photo.mjs'
      - 'tools/qualify_installed_photo.mjs'
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Obtain the exact failed installer for diagnosis only
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, os, shutil, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from obtain_host_component import api, download, REPOSITORY_ID
          approved = {'artifactId': 13435874962, 'archiveSha256': '56a80e3dc7ff3ba2e5ec7af30de9e68666906e20740aca5bbc6ba38c6f09b4b8'}
          artifact = api('actions/artifacts/13435874962')
          run = api('actions/runs/42069824485')
          head = '6c4a931e203028108386273c0e723daa0845b4ec'
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          assert run['head_sha'] == head and run['run_attempt'] == 1
          assert run['path'] == '.github/workflows/windows-compiled-host.yml'
          assert run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main'
          assert all(run[key]['id'] == REPOSITORY_ID for key in ['repository', 'head_repository'])
          assert artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == head
          assert artifact['expired'] is False and artifact['digest'] == 'sha256:' + approved['archiveSha256']
          assert 0 < artifact['size_in_bytes'] < 2 * 1024**3
          root = Path(os.environ['RUNNER_TEMP']) / 'failed-photo-diagnostic'
          root.mkdir()
          archive = root / 'installer.zip'
          download(approved, archive, artifact['size_in_bytes'])
          name = 'FrameleafNativeServer_0.1.0_x64-setup-unsigned.exe'
          with zipfile.ZipFile(archive) as package:
              assert package.namelist() == [name]
              assert 0 < package.getinfo(name).file_size < 2 * 1024**3
              with package.open(name) as source, (root / 'setup.exe').open('xb') as target:
                  shutil.copyfileobj(source, target)
          assert hashlib.file_digest((root / 'setup.exe').open('rb'), 'sha256').hexdigest() == 'e66393af85183a2a41375d085b04cad21dd0915ebab9b627f42c2b17a27f584b'
          print('Exact failed installer staged for private diagnosis; not release-qualified')
      - name: Install the diagnostic candidate and initialize the hosted filter
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'failed-photo-diagnostic/setup.exe'
          if (Test-Path (Join-Path $env:ProgramFiles 'Frameleaf')) { throw 'Expected a fresh package location' }
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          if ($install.ExitCode) { throw 'Diagnostic installer failed' }
          Start-Service CldFlt -ErrorAction Continue
          $volumes = @($env:SystemDrive, (Split-Path -Qualifier $env:RUNNER_TEMP)) | Sort-Object -Unique
          foreach ($volume in $volumes) { fltmc.exe attach CldFlt $volume }
          $global:LASTEXITCODE = 0
      - name: Reproduce with the published Desktop and current diagnostic
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = 'Frameleaf_0.1.1_x64-setup-unsigned.exe'
          gh release download v0.1.1 --repo Frameleaf/frameleaf-desktop --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Published desktop download failed' }
          $setup = Join-Path $env:RUNNER_TEMP $name
          if ((Get-FileHash $setup).Hash.ToLowerInvariant() -cne 'c61c8f4d3ff9c0b122a3df82886f43a203f8acd34cb607d62abfe292c4ed8dba') { throw 'Published desktop identity changed' }
          $destination = Join-Path $env:RUNNER_TEMP 'FrameleafWelcome'
          $install = Start-Process $setup -ArgumentList '/S', "/D=$destination" -PassThru -Wait
          if ($install.ExitCode) { throw 'Desktop installation failed' }
          powershell.exe -NoProfile -File tools/qualify_windows_welcome.ps1 -Executable (Join-Path $destination 'frameleaf-desktop.exe') -InstalledHost
          if ($LASTEXITCODE) { throw 'Private installed photo reproduction failed' }
