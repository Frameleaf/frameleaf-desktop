name: Factory desktop runtime
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Runtime targets (Windows can be built independently)'
        type: choice
        default: macos-linux
        options: [macos-linux, all, linux, windows, macos-aarch64]
      epoch:
        description: 'Runtime epoch admitted by the release policy'
        type: string
        default: '7'
        required: true
      accelerated:
        description: 'GPU packs: default = CoreML in the macos-aarch64 pack, plus the CUDA and OpenVINO packs for Windows and Linux x86_64 as downloadable release parts; none = processor only; cuda-ort / openvino-ort = the processor pack plus only that downloadable pack'
        type: choice
        default: default
        options: [default, none, cuda-ort, openvino-ort]
permissions:
  contents: read
concurrency:
  group: factory-desktop-runtime
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.inputs.outputs.matrix }}
      installer: ${{ steps.inputs.outputs.installer }}
      delivered: ${{ steps.inputs.outputs.delivered }}
      has_delivered: ${{ steps.inputs.outputs.has_delivered }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - id: inputs
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
          RUNTIME_EPOCH: ${{ inputs.epoch }}
          RUNTIME_ACCELERATED: ${{ inputs.accelerated }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { releaseMatrix } from './tools/release_inputs.mjs';
          import { factoryPacksFor, factorySourceRevisionFor } from './tools/factory_runtime.mjs';
          const trust = JSON.parse(readFileSync('runtime/release-trust.json'));
          const epoch = Number(process.env.RUNTIME_EPOCH);
          if (!/^[1-9][0-9]*$/.test(process.env.RUNTIME_EPOCH) || !Number.isSafeInteger(epoch) || epoch < trust.minimumRuntimeEpoch)
            throw new Error('runtime_factory_epoch_invalid');
          // One entry per pack: the pack each installer carries and (FD-60) the CUDA and
          // OpenVINO packs the app downloads on demand, named `<target>-<profile>`.
          const packs = [];
          for (const item of releaseMatrix(process.env.RELEASE_PLATFORMS).include) {
            const built = factoryPacksFor(item.target, process.env.RUNTIME_ACCELERATED);
            for (const { profile, delivered } of built)
              packs.push({
                ...item,
                profile,
                delivered,
                deliveries: !delivered && built.some((pack) => pack.delivered),
                pack: delivered ? `${item.target}-${profile}` : item.target,
                source_revision: factorySourceRevisionFor(item.target, profile),
              });
          }
          const delivered = packs.filter((pack) => pack.delivered);
          for (const [name, include] of [['matrix', packs], ['installer', packs.filter((pack) => !pack.delivered)], ['delivered', delivered]])
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${JSON.stringify({ include })}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `has_delivered=${delivered.length > 0}\n`);
          JS
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: ${{ matrix.source_revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Linux ELF relocation tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/frameleaf-patchelf"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error --output "$tool_dir/patchelf.tar.gz" "https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-$(uname -m).tar.gz"
          case "$(uname -m)" in
            x86_64) digest=a6818fef80128fb354423234ecacdcca3e993913d774e5d8346bc63f70fed4cf ;;
            aarch64) digest=a2f8f5add5910a521d35062adf2c9f55d75b65ae5508d290758787004054e702 ;;
            *) echo 'Unapproved patchelf target' >&2; exit 1 ;;
          esac
          echo "$digest  $tool_dir/patchelf.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/patchelf.tar.gz" -C "$tool_dir"
          echo "$tool_dir/bin" >> "$GITHUB_PATH"
      - name: Build the approved unsigned runtime without signing credentials
        env:
          SOURCE_REVISION: ${{ matrix.source_revision }}
          RUNTIME_EPOCH: ${{ inputs.epoch }}
          RUNTIME_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s desktop/tools -p 'test_build_runtime.py'
          python desktop/tools/build_runtime.py --source source --output candidate --revision "$SOURCE_REVISION" --epoch "$RUNTIME_EPOCH" --profile "$RUNTIME_PROFILE"
          manifests=(manifest.json)
          if [ -f candidate/manifest-accelerated.json ]; then manifests+=(manifest-accelerated.json); fi
          tar -cf runtime-unsigned.tar -C candidate "${manifests[@]}" payload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-runtime-${{ matrix.pack }}
          path: runtime-unsigned.tar
          retention-days: 7
          if-no-files-found: error
      - name: Retain bounded private build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-runtime-failure-${{ matrix.pack }}
          path: .candidate.error.log
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
  # FD-60: the packs too large for an installer. Only the accelerated manifest is signed; the
  # pack is cut into release parts with a signed delivery manifest the installer carries.
  deliver:
    needs: [prepare, build]
    if: needs.prepare.outputs.has_delivered == 'true'
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.delivered) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unsigned-runtime-${{ matrix.pack }}
          path: unsigned-download
      - name: Extract data only, without executing the built runtime
        shell: python
        run: |
          import tarfile
          with tarfile.open('unsigned-download/runtime-unsigned.tar') as archive:
              archive.extractall('candidate', filter='data')
      - name: Sign the accelerated manifest, cut the pack into release parts and sign its delivery manifest
        env:
          FACTORY_PRIVATE_KEY: ${{ secrets.DESKTOP_RELEASE_ED25519_PRIVATE_KEY }}
          RUNTIME_TARGET: ${{ matrix.target }}
          RUNTIME_EPOCH: ${{ inputs.epoch }}
          RUNTIME_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FACTORY_PRIVATE_KEY:?Missing factory signing key}"
          rm -f unsigned-download/runtime-unsigned.tar
          printf '%s\n' "$FACTORY_PRIVATE_KEY" | node tools/factory_runtime.mjs "$PWD/candidate" "$RUNTIME_TARGET" "$RUNTIME_EPOCH" "$PWD/delivery"
          mkdir delivery-manifest
          mv "delivery/$RUNTIME_PROFILE.json" "delivery/$RUNTIME_PROFILE.sig" delivery-manifest/
          { echo "### $RUNTIME_PROFILE for $RUNTIME_TARGET"; echo '```'; ls -l delivery/parts; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-accelerated-manifest-${{ matrix.pack }}
          path: delivery-manifest/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-accelerated-parts-${{ matrix.pack }}
          path: delivery/parts/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  sign:
    needs: [prepare, build, deliver]
    # Every pack of the run or none: an installer never ships without the delivery manifests
    # of the packs built beside it.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.deliver.result == 'success' || needs.deliver.result == 'skipped') }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.installer) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unsigned-runtime-${{ matrix.pack }}
          path: unsigned-download
      - name: Extract data only, without executing the built runtime
        shell: python
        run: |
          import tarfile
          with tarfile.open('unsigned-download/runtime-unsigned.tar') as archive:
              archive.extractall('candidate', filter='data')
      # FD-60: the installer carries the signed delivery manifests of this target's
      # downloadable packs; signing below verifies each against this pack's target and epoch.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: matrix.deliveries
        with:
          pattern: factory-accelerated-manifest-${{ matrix.target }}-*
          merge-multiple: true
          path: candidate/accelerated
      - name: Verify Apple runtime and sign its embedded code before sealing the inventory
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RUNTIME_TARGET: ${{ matrix.target }}
          RUNTIME_EPOCH: ${{ inputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { checkFactoryInputs } from './tools/factory_runtime.mjs';
          import { verifyUnsignedCandidate } from './tools/sign_runtime.mjs';
          await checkFactoryInputs('candidate', process.env.RUNTIME_TARGET, Number(process.env.RUNTIME_EPOCH));
          await verifyUnsignedCandidate('candidate');
          JS
          bash tools/import_apple_certificate.sh
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          python tools/sign_macos_runtime.py candidate
      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12"
          if [ -f "$RUNNER_TEMP/desktop-release.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/desktop-release.keychain-db"; fi
      - name: Sign and verify the exact archive accepted by installer packaging
        env:
          FACTORY_PRIVATE_KEY: ${{ secrets.DESKTOP_RELEASE_ED25519_PRIVATE_KEY }}
          RUNTIME_TARGET: ${{ matrix.target }}
          RUNTIME_EPOCH: ${{ inputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FACTORY_PRIVATE_KEY:?Missing factory signing key}"
          printf '%s\n' "$FACTORY_PRIVATE_KEY" | node tools/factory_runtime.mjs "$PWD/candidate" "$RUNTIME_TARGET" "$RUNTIME_EPOCH"
          manifests=(manifest.json manifest.sig)
          if [ -f candidate/manifest-accelerated.json ]; then manifests+=(manifest-accelerated.json manifest-accelerated.sig); fi
          if [ -d candidate/accelerated ]; then manifests+=(accelerated); fi
          tar -cf runtime.tar -C candidate "${manifests[@]}" payload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-runtime-${{ matrix.target }}
          path: runtime.tar
          retention-days: 14
          if-no-files-found: error
