name: Private CPU runtime candidate
on:
  pull_request:
    paths:
      - 'tools/build_runtime.py'
      - 'tools/test_build_runtime.py'
      - 'tools/build_coreml_observer.py'
      - 'tools/smoke_accelerated_runtime.py'
      - 'tools/linked_libraries.py'
      - 'tools/pe_imports.py'
      - 'native/**'
      - 'runtime/**'
      - 'src-tauri/src/native_runtime.rs'
      - 'src-tauri/src/native_runtime/**'
      - 'src-tauri/src/runtime_store.rs'
      - 'src-tauri/src/process_tree.rs'
      - '.github/workflows/runtime-pack.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The same Linux image the factory builds the runtime on (tools/release_inputs.mjs).
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: 94d52a8244da0edfa9f680a3b357fdccbc0ad7e8
          path: server
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Linux ELF relocation tooling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/frameleaf-patchelf"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error --output "$tool_dir/patchelf.tar.gz" https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz
          echo "a6818fef80128fb354423234ecacdcca3e993913d774e5d8346bc63f70fed4cf  $tool_dir/patchelf.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/patchelf.tar.gz" -C "$tool_dir"
          echo "$tool_dir/bin" >> "$GITHUB_PATH"
      - name: Builder regression checks
        run: python -m unittest discover -s desktop/tools -p 'test_*.py'
      - name: Construct and relocate the locked private runtime
        run: python desktop/tools/build_runtime.py --source server --output candidate --revision 94d52a8244da0edfa9f680a3b357fdccbc0ad7e8 --epoch 6
      - name: Check no Linux runtime binary needs a newer C library than Ubuntu 22.04 has
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python desktop/tools/check_linux_glibc.py --max 2.35 candidate/payload | tee -a "$GITHUB_STEP_SUMMARY"
      # FD-52: the accelerated pack (processor and CoreML manifests over one payload) must build on
      # the hosted Apple Silicon runner; it is not signed, published or run on a GPU here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        with:
          repository: Frameleaf/frameleaf-app
          ref: 4da8e50954ff08be437db51a0872ce5da0e8ba06
          path: coreml-server
          persist-credentials: false
      - name: Construct the CoreML pack with its device collector
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          python desktop/tools/build_runtime.py --source coreml-server --output coreml-candidate --revision 4da8e50954ff08be437db51a0872ce5da0e8ba06 --epoch 6 --profile coreml-ort
          test -s coreml-candidate/manifest.json
          test -s coreml-candidate/manifest-accelerated.json
          coreml-candidate/payload/python/bin/python3.12 -I -B -c "import onnxruntime as ort; print(ort.__version__, ort.get_available_providers()); assert 'CoreMLExecutionProvider' in ort.get_available_providers()"
      - name: Retain private validation receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpu-runtime-receipts-${{ runner.os }}
          path: |
            candidate/manifest.json
            candidate/payload/provenance.json
            candidate/payload/requirements.txt
            candidate/payload/build-requirements.txt
          retention-days: 7
          if-no-files-found: error
      - name: Retain private failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpu-runtime-failure-${{ runner.os }}
          path: .candidate.error.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
  # FD-56: the CUDA and OpenVINO packs must build from the locked source on the hosted Windows and
  # Linux runners and load their provider. Nothing is signed, published or run on a GPU here.
  accelerated:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        profile: [cuda-ort, openvino-ort]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: 4da8e50954ff08be437db51a0872ce5da0e8ba06
          path: server
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Construct the accelerated pack and load its provider
        shell: bash
        env:
          RUNTIME_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python desktop/tools/build_runtime.py --source server --output candidate --revision 4da8e50954ff08be437db51a0872ce5da0e8ba06 --epoch 6 --profile "$RUNTIME_PROFILE"
          test -s candidate/manifest.json
          test -s candidate/manifest-accelerated.json
          case "$RUNTIME_PROFILE" in
            cuda-ort) provider=CUDAExecutionProvider ;;
            openvino-ort) provider=OpenVINOExecutionProvider ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then python=candidate/payload/python/python.exe; else python=candidate/payload/python/bin/python3.12; fi
          du -sh candidate/payload || true
          "$python" -I -B desktop/tools/smoke_accelerated_runtime.py "$provider"
      - name: Retain private failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accelerated-runtime-failure-${{ runner.os }}-${{ matrix.profile }}
          path: .candidate.error.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
