name: Private CPU runtime candidate
on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only the Windows CPU runtime
        type: boolean
        default: true
      qualify_windows_artifact_id:
        description: Replay this retained Windows artifact instead of building
        type: string
        default: ''
      qualify_windows_artifact_sha256:
        description: SHA-256 of the retained Windows artifact ZIP
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-native-build
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_only && inputs.qualify_windows_artifact_id == ''
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Frameleaf/frameleaf-app
          ref: 1bf2ad55521c49f574cba2f450eb13d49652ea80
          path: server
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Builder regression checks
        run: python -m unittest discover -s desktop/tools -p 'test_*.py'
      - name: Construct and relocate the locked private runtime
        run: python desktop/tools/build_runtime.py --source server --output candidate --revision 1bf2ad55521c49f574cba2f450eb13d49652ea80 --epoch 16
      - name: Retain private validation receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpu-runtime-receipts-${{ runner.os }}
          path: |
            candidate/manifest.json
            candidate/payload/provenance.json
            candidate/payload/requirements.txt
            candidate/payload/build-requirements.txt
          retention-days: 7
          if-no-files-found: error
      - name: Retain the private Windows runtime for qualification
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpu-runtime-candidate-Windows
          path: candidate/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Retain private failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpu-runtime-failure-${{ runner.os }}
          path: .candidate.error.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
  qualify-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_only && inputs.qualify_windows_artifact_id != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-runtime-qualification.yml
    with:
      artifact_id: ${{ inputs.qualify_windows_artifact_id }}
      artifact_sha256: ${{ inputs.qualify_windows_artifact_sha256 }}
