name: Windows downloaded database qualification
on:
  pull_request:
    paths:
      - '.github/workflows/windows-database-relocation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-database-relocation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.11.1'
      - name: Verify the approved archive and qualify its relocated database
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          sys.path.insert(0, 'tools')
          from bind_host_raw import read_receipt
          from build_host_bundle import host_entries
          from build_host_database_windows import qualify
          from build_host_ffmpeg import unpack
          from build_host_server import stage_server
          from build_host_windows_support import NODE_EXE_SHA
          from build_runtime import build_environment, inventory, run, sha256
          from obtain_host_component import obtain
          from obtain_windows_host_components import checked_receipt
          approved = {
              'artifactId': 13117939175, 'runId': 41390851323, 'runAttempt': 1,
              'headSha': '7338f418bb10f39aec33a6eabf968eb8ea47e2ee',
              'workflow': '.github/workflows/windows-host-database.yml',
              'archiveSha256': '1e735c375493250029932b779fd1f72f01851f81bbd57cb12beb84e600b8126e',
          }
          root = Path(os.environ['RUNNER_TEMP']) / 'database-relocation'
          root.mkdir(mode=0o700)
          work = root / 'work'
          work.mkdir(mode=0o700)
          report = {'qualification': 'failed', 'runtimeQualified': False,
                    'redistributable': False, 'approved': approved, 'phase': 'acquire'}
          try:
              obtain(approved, work / 'input')
              original = work / 'input/component/postgres'
              receipt = read_receipt(work / 'input/component/qualification.json')
              lock = read_receipt(Path('runtime/host-database.json'))
              if (receipt.get('qualification') != 'passed' or receipt.get('pins') != lock
                      or receipt.get('files') != inventory(original)):
                  raise RuntimeError('Approved database inventory or policy mismatch')
              host = work / 'host'
              host.mkdir(mode=0o700)
              relocated = host / 'pg'
              stage_server(original, relocated)
              if inventory(relocated) != receipt['files']:
                  raise RuntimeError('Relocated database inventory mismatch')
              acl_env = build_environment(work, os.environ)
              acl_env['FRAMELEAF_DIAGNOSTIC_ROOT'] = str(relocated / 'bin/initdb.exe')
              acl_script = ('$a=Get-Acl -LiteralPath $env:FRAMELEAF_DIAGNOSTIC_ROOT;'
                            '@{owner=$a.Owner;sddl=$a.Sddl}|ConvertTo-Json -Compress')
              report['databaseExecutableAccess'] = json.loads(run([
                  Path(os.environ['SystemRoot']) / 'System32/WindowsPowerShell/v1.0/powershell.exe',
                  '-NoProfile', '-NonInteractive', '-Command', acl_script], cwd=work, env=acl_env))
              for prefix in [original, relocated]:
                  report['phase'] = prefix.name + '-version'
                  print(report['phase'], flush=True)
                  env = build_environment(work, os.environ)
                  env['PATH'] = str(prefix / 'bin') + os.pathsep + env['PATH']
                  env['FRAMELEAF_BUILD_ERROR_LOG'] = str(root / 'command-error.log')
                  run([prefix / 'bin/initdb.exe', '--version'], cwd=work, env=env)
              report['phase'] = 'relocated-restore-restart-checksums'
              print(report['phase'], flush=True)
              fixtures = work / 'fixtures'
              fixtures.mkdir()
              report['checks'] = qualify(relocated, fixtures, lock, env)
              # Match build_windows_host's merged environment, not installed-host acceptance.
              report['phase'] = 'host-environment-restore-restart-checksums'
              print(report['phase'], flush=True)
              module = (Path.cwd() / 'runtime/host-agent.mjs').as_uri()
              node = Path(shutil.which('node'))
              if sha256(node) != NODE_EXE_SHA:
                  raise RuntimeError('Host Node executable digest mismatch')
              script = ('import {hostEnvironment} from ' + json.dumps(module) + ';'
                        'console.log(JSON.stringify(hostEnvironment({runtime:process.argv[1],'
                        'state:process.argv[2],entryPoints:JSON.parse(process.argv[3])})));')
              env.update(json.loads(run([node, '--input-type=module', '--eval',
                                         script, host, work, json.dumps(host_entries())], cwd=work, env=env)))
              env['FRAMELEAF_HDR_BINDING'] = str(host / 'media/image-hdr.node')
              env['OMP_THREAD_LIMIT'] = '1'
              host_fixtures = work / 'host-fixtures'
              host_fixtures.mkdir()
              report['hostEnvironmentChecks'] = qualify(relocated, host_fixtures, lock, env)
              report['phase'] = 'database-with-raw-path'
              print(report['phase'], flush=True)
              raw_approved = {
                  'artifactId': 13162233776, 'runId': 41481808035, 'runAttempt': 2,
                  'headSha': 'f779bb454777231b2be371d13841571bbca30e00',
                  'workflow': '.github/workflows/windows-host-raw.yml',
                  'archiveSha256': '68bfae045c6be99739da82a53ce76d13db8ae855cb9c47c53e4503d7324255a9',
              }
              obtain(raw_approved, work / 'raw-input')
              expanded = work / 'raw-expanded'
              expanded.mkdir()
              unpack(work / 'raw-input/component/windows-raw-component.tar.gz', expanded)
              raw = expanded / 'raw-candidate'
              raw_receipt = checked_receipt(raw, 'raw', 'Windows-AMD64')
              stage_server(raw / 'raw', host / 'raw')
              if inventory(host / 'raw') != raw_receipt['files']:
                  raise RuntimeError('Relocated RAW inventory mismatch')
              raw_fixtures = work / 'raw-path-fixtures'
              raw_fixtures.mkdir()
              report['rawPathChecks'] = qualify(relocated, raw_fixtures, lock, env)
              report['rawApproved'] = raw_approved
              if inventory(relocated) != receipt['files']:
                  raise RuntimeError('Database payload changed during qualification')
              report['qualification'] = 'passed'
          except Exception:
              # A loader failure has no stderr; identify which bundled DLL cannot load.
              if 'original' in locals() and original.is_dir():
                  probe = 'import ctypes,sys; d=ctypes.WinDLL(sys.argv[1]); print("loaded",sys.argv[1])'
                  env = build_environment(work, os.environ)
                  env['PATH'] = str(original / 'bin') + os.pathsep + env['PATH']
                  with (root / 'loader.log').open('w', encoding='utf-8') as log:
                      for dll in sorted((original / 'bin').glob('*.dll')):
                          print(dll.name, file=log, flush=True)
                          subprocess.run([sys.executable, '-I', '-S', '-c', probe, dll],
                                         cwd=work, env=env, stdout=log, stderr=log, timeout=15)
              raise
          finally:
              try:
                  shutil.rmtree(work)
              except BaseException:
                  report['qualification'] = 'failed'
                  raise
              finally:
                  (root / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
      - name: Retain bounded evidence without database binaries or private fixtures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-database-relocation-evidence
          path: |
            ${{ runner.temp }}/database-relocation/qualification.json
            ${{ runner.temp }}/database-relocation/command-error.log
            ${{ runner.temp }}/database-relocation/loader.log
          retention-days: 7
          if-no-files-found: ignore
